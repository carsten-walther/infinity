# ═══════════════════════════════════════════════════════════
#  Infinity
#  Analogue Clock with NeoPixels | MQTT | Home Assistant
# ═══════════════════════════════════════════════════════════

# Pinout: https://randomnerdtutorials.com/esp32-c3-pinout-reference-gpios/

substitutions:

  project_name: infinity
  author_name: carsten-walther
  friendly_name: Infinity
  comment: Just another analogue clock
  version: 2026.8.16
  area: Miscellaneous

  #
  # GPIOs
  #
  # GPIO10 is one of the few pins on this board with no second job: no
  # strapping function, no ADC channel, no flash, no USB, no UART. GPIO02 - the
  # previous choice - is a strapping pin. It worked, because the pin is
  # high-impedance at reset and a WS2811 data input does not pull it down, but
  # a level shifter, a pulldown or a long noisy cable turns that into a device
  # that boots into download mode now and then.
  PIN_LED_RING: GPIO10

  # ADC1 channel 1. Only GPIO00, GPIO01, GPIO03 and GPIO04 are usable analogue
  # inputs here: everything else is either taken or on ADC2, which the C3
  # cannot read while WiFi is up.
  PIN_BRIGHTNESS: GPIO01

  #
  # LED ring
  #
  # 60 is not a decorative choice: one pixel per minute means a pixel index IS
  # the minute (and second) value, and the hour hand belongs at (hour % 12) * 5.
  # Every effect below and all of the indicator maths assume that mapping, so
  # changing this number alone does not produce a working clock.
  #
  NUM_LEDS: "60"

  #
  # How far the "Darken to midday" face dims the arc behind the trailing hand,
  # as a fraction of what is already there. 0.15 keeps a visible trace; 0 blanks
  # it completely.
  #
  # This scales the colour rather than subtracting a fixed amount from each
  # channel, which is what it used to do - subtracting 240 out of 255 left at
  # most 15 per channel, so it erased the arc instead of darkening it, and it
  # shifted the hue on the way because the channels hit zero at different points.
  #
  MIDDAY_DARKEN: "0.15"

  #
  # Brightness the clock comes back to on boot and on every switch-on. 60 LEDs
  # at full white draw around 3.6 A - the ring runs on its own supply here, so
  # that is a question for the power brick rather than for the board, but it is
  # also far brighter than a room needs.
  #
  DEFAULT_BRIGHTNESS: "70%"

  #
  # Resting colour
  #
  # The colour the ring carries underneath the effects. Every effect here writes
  # its pixels directly and ignores it, so it is only visible in one situation:
  # no effect running with the light on, which is reachable from the LED color
  # entity's own effect list. The Effect select cannot get there - its "Off"
  # entry switches the ring off instead. It is also what the light fades through
  # when an effect starts.
  #
  # Warm white rather than flat 100/100/100. Note that gamma_correct is 1.0 on
  # this light, so these percentages go to the LEDs linearly and not corrected
  # for perception - low values come out brighter than they read here.
  #
  IDLE_RED: "100%"
  IDLE_GREEN: "60%"
  IDLE_BLUE: "20%"

  #
  # Ambient light calibration
  #
  # The voltage the LDR divider on ${PIN_BRIGHTNESS} produces at the two ends
  # of the range the face should react to. The Time effect maps anything in
  # between onto a linear dim factor and clamps outside it. Volts, matching
  # what the Brightness sensor publishes.
  #
  # Measured on the built device (2026-08-16):
  #   LDR covered          0.09 V
  #   normal room light    0.93 V
  #   torch on the sensor  2.96 V
  #
  # Note these are NOT the measured extremes. The full span 0.09 - 2.96 V would
  # put every indoor level in the bottom third of the scale, and the clock
  # would sit at ~40% brightness in a normally lit room. An LDR divider is
  # heavily non-linear and most of its swing sits above anything a living room
  # ever reaches, so the useful window is the indoor band: 1.20 V is treated as
  # "bright enough for full brightness" and anything above it clamps there.
  # Widen AMBIENT_BRIGHT if the clock stays too bright in the evening.
  #
  # If the clock dims the wrong way round, the photoresistor sits on the other
  # leg of the divider: SWAP these two values, no code change needed. Measured
  # polarity here is dark = low, bright = high, so no swap is needed.
  #
  AMBIENT_DARK: "0.10"
  AMBIENT_BRIGHT: "1.20"

  #
  # How far the face is allowed to dim at night, as a fraction of the light's
  # own brightness setting. Never 0 - a clock that reads as "off" in a dark room
  # is worse than one that is slightly too bright.
  #
  MIN_FACE_BRIGHTNESS: "0.15"

  #
  # Sun effect
  #
  # Starting point for the Latitude and Longitude text entities, which is where
  # the effect actually reads its coordinates from - these only seed them on the
  # very first boot. Decimal degrees, north and east positive.
  #
  DEFAULT_LATITUDE: "52.520"
  DEFAULT_LONGITUDE: "13.405"

  #
  # Solar elevation, in degrees, at which the light has finished warming up and
  # reads as plain daylight. Below it the colour runs red - orange - yellow, the
  # way the sun does near the horizon. Lower it for a shorter, sharper sunrise.
  #
  # Written with a decimal point on purpose: the lambda appends "f" to build a
  # float literal, and "25f" is not one.
  #
  SUN_WHITE_ELEVATION: "25.0"

  #
  # Fire effect
  #
  # COOLING: how fast a flame cools down each frame. Higher means shorter,
  # darker flames. The original carried a comment recommending 20-100 and then
  # set 15, which is far too little: sparks arrive faster than the heat drains,
  # every cell pins at the top of the scale, and the top of the palette is
  # white. That only became visible once the heat buffer was made to persist
  # between frames - before that it was re-created as uninitialised stack
  # memory every frame and nothing could accumulate.
  #
  # SPARKING: chance out of 255 that a new spark ignites at the base on any
  # given frame. Higher is a more active fire. Sensible range 50-200.
  #
  # MAX_HEAT: caps the palette lookup. The heat-to-colour ramp runs
  # black -> red -> orange -> yellow -> white, and the white only starts above
  # ~170. Clamping there keeps even the hottest cells yellow. Raise it towards
  # 255 to let the white tips back in.
  #
  FIRE_COOLING: "55"
  FIRE_SPARKING: "120"
  FIRE_MAX_HEAT: "170"

  #
  # Moon effect
  #
  # Peak brightness, 0-255, before the light's own brightness setting scales it.
  # Moonlight is meant to be dim - the whole ring at 255 is a lamp, not a moon.
  #
  MOON_BRIGHTNESS: "64"

#
# https://esphome.io/components/esphome
#
esphome:
  name: "${project_name}"
  friendly_name: "${friendly_name}"
  comment: "${comment}"
  area: "${area}"

  project:
    name: "${author_name}.${project_name}"
    version: "${version}"

  on_boot:
    # priority 600 runs after hardware init, so the ring is already addressable
    - priority: 600
      then:
        - light.turn_on:
            id: led_ring_id
            effect: Twinkle

    # NOTE: this block is effectively dead and kept only to document that.
    # Every on_boot trigger fires during setup(), milliseconds apart - the
    # priorities order them, they do not space them out in time. WiFi has not
    # associated yet at this point, so the condition is false on every boot and
    # the Twinkle above is never the "waiting for network" indicator it looks
    # like. Doing that properly needs a wifi on_connect / on_disconnect trigger,
    # not a boot priority.
    - priority: 200
      then:
        if:
          condition:
            wifi.connected:
          then:
            - light.turn_off:
                id: led_ring_id

    # Negative priority runs after every component is set up, which is what both
    # of these need: the light has to exist before an effect can be selected,
    # and component.update() on a not-yet-set-up entity is not something to rely
    # on.
    # Deliberately NOT -100: a restoring global is a component of its own with
    # setup_priority::HARDWARE, and incrementing at the same priority would be a
    # race against the load() that reads the stored value - the increment could
    # land on the initial 0 and then be overwritten by the restore, so the count
    # would never grow. 700 is safely after every HARDWARE component.
    - priority: 700
      then:
        - lambda: |-
            id(reset_count_id) += 1;

    - priority: -100
      then:
        - light.turn_on:
            id: led_ring_id
            brightness: ${DEFAULT_BRIGHTNESS}
            red: ${IDLE_RED}
            green: ${IDLE_GREEN}
            blue: ${IDLE_BLUE}
            effect: Time
        # Both are pushed rather than polled: the version string is a compile-time
        # constant and the reset count changes once per boot, so an interval could
        # only republish an unchanged value - publish_state does not deduplicate.
        - component.update: firmware_version_id
        - component.update: reset_count_sensor_id

  # priority 700 runs early enough that the light is still controllable
  on_shutdown:
    priority: 700
    then:
      - light.turn_off:
          id: led_ring_id

#
# https://esphome.io/components/esp32
#
esp32:
  board: esp32-c3-devkitm-1

  # Half the 160 MHz this variant defaults to. Dynamic power scales with clock,
  # so this is the second lever against the die temperature after the WiFi power
  # save mode - smaller than that one, and unlike it, free: nothing here is
  # compute-bound. The heaviest load is the Fire effect at 30 ms over 30 heat
  # cells, and Time at 500 ms over 60 pixels; an ESP8266 does comparable work at
  # this clock. Raise it back to 160MHZ if an effect ever starts stuttering.
  cpu_frequency: 80MHZ

  framework:
    # esp-idf, not arduino: the only thing that tied this device to arduino was
    # the neopixelbus light platform, which wraps an Arduino library. The light
    # below now uses esp32_rmt_led_strip, which drives the same RMT peripheral
    # neopixelbus was already configured to use - so this costs nothing on the
    # wire and drops the whole Arduino layer from flash and RAM.
    #
    # Consequence: no Arduino-only APIs (String, WiFi.*, byte, the min/max
    # macros) in any lambda here. The effect lambdas use std::min / std::max /
    # std::abs for exactly that reason.
    type: esp-idf

#
# https://esphome.io/components/wifi
#
wifi:
  id: wifi_id
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: .local
  fast_connect: True

  # LIGHT, not the NONE this started with: NONE keeps the radio powered up
  # permanently, which was the single largest heat source on this board - the
  # die sat at 67 C with the LED ring on its own supply, so none of that was
  # coming from the strip. LIGHT maps to WIFI_PS_MIN_MODEM, which sleeps between
  # DTIM beacons and wakes for every one of them.
  #
  # Measured: 67 C -> 38-41 C, together with the cpu_frequency drop above.
  #
  # The trade is one-sided in this device's favour. Only INBOUND traffic is
  # delayed - the access point buffers it until the next beacon, typically 100
  # to 300 ms. Outbound is not affected at all, so the sensor publishes that
  # make up almost all of this node's traffic go out immediately, and the clock
  # itself never touches the network between SNTP syncs.
  #
  # HIGH would sleep through a longer listen interval. Not worth it: the delay
  # reaches seconds and the link gets fragile at this RSSI (-63 to -65 dBm).
  #
  # If OTA updates start failing, this is the first line to put back to NONE.
  power_save_mode: LIGHT

  enable_on_boot: True

  # Reduced from the ~20 dBm default. Barely moves the power budget - this node
  # transmits well under 0.1% of the time - but it does no harm either. Do not
  # go lower: at this RSSI a weaker uplink means retransmits, and those cost
  # more airtime than the lower power saves.
  output_power: 12dB
  ap:
    ssid: "${project_name}"
    password: !secret wifi_ap_password

#
# https://esphome.io/components/captive_portal
#
captive_portal:

#
# Only the classic push OTA from the dashboard: this node has no display to
# show progress on, so the http_request pull path is not worth the flash.
#
ota:
  #
  # https://esphome.io/components/ota/esphome
  #
  - platform: esphome
    password: !secret ota_password

#
# https://esphome.io/components/api
#
api:
  # Enable transport encryption of the API layer.
  encryption:
    # The pre-shared key for the encryption.
    key: !secret api_encryption_key
  # 0s disables the automatic reboot when Home Assistant is unreachable: this
  # node keeps running the clock and publishing via MQTT even without an API
  # client, which matters because it is the only clock in the room.
  reboot_timeout: 0s

#
# https://esphome.io/components/mqtt
#
mqtt:
  id: mqtt_client_id
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  reboot_timeout: 0s
  enable_on_boot: True
  # No autodiscovery: the entities are declared in Home Assistant by hand, so
  # discovery would only publish retained config topics nobody consumes.
  discovery: False
  keepalive: 60s

#
# https://esphome.io/components/web_server
#
web_server:
  port: 80
  version: 3
  # assets served from flash instead of a CDN, so the page also works while the
  # WiFi has no route to the internet - e.g. from the fallback access point
  local: True

#
# https://esphome.io/components/time
#
time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org

#
# https://esphome.io/components/logger
#
logger:
  # ERROR only: the ring is driven from a lambda that runs many times a second,
  # and logging at that rate over the api costs more than the messages are worth
  level: ERROR

#
# Provides the reset_reason text sensor further down. Nothing else from this
# component is enabled - the heap and loop-time sensors it can expose poll
# continuously, and this device has no memory problem to watch.
#
# https://esphome.io/components/debug
#
debug:

#
# https://esphome.io/components/globals
#
globals:

  #
  # Latch so the "invalid time from sntp" error is logged once per boot instead
  # of on every frame. The Time effect runs several times a second; without this
  # a device that never reaches an NTP server would flood the log and the api.
  #
  - id: global_debug
    type: int
    restore_value: no
    initial_value: '0'

  #
  # Mirrors the Enable seconds switch. The effect lambda needs the value at
  # frame rate, and reading a global is cheaper than going through the switch
  # component every time.
  #
  - id: global_enable_seconds
    type: int
    restore_value: no
    initial_value: '0'

  #
  # Survives restarts, so a rising count is proof the device rebooted even if
  # nobody was watching the log. Counts every restart alike - OTA, the Restart
  # button, a power cut and a watchdog are indistinguishable here, which is why
  # Reset Reason sits next to it. A factory reset clears it back to 0.
  #
  - id: reset_count_id
    type: int
    restore_value: yes
    initial_value: '0'

#
# https://esphome.io/components/text_sensor
#
text_sensor:

  #
  # Reset Reason
  # https://esphome.io/components/text_sensor/debug
  #
  # Cause of the last restart, straight from esp_reset_reason(). Read it
  # together with Reset Count and Device Uptime: the reason alone cannot tell
  # you that a restart happened while nobody was looking, and a rising count at
  # a low uptime is the signature of a device rebooting in a loop.
  #
  - platform: debug
    reset_reason:
      id: reset_reason_id
      name: Reset Reason
      icon: mdi:restart-alert
      entity_category: diagnostic

  #
  # ESPHome Version
  # https://esphome.io/components/text_sensor/version
  #
  - platform: version
    name: ESPHome Version
    icon: mdi:new-box

  #
  # Firmware Version
  #
  - platform: template
    id: firmware_version_id
    name: Firmware Version
    icon: mdi:new-box
    # A compile-time constant. Polling it re-sent the same string to the api and
    # mqtt every 60s for the lifetime of the device; publish_state does not
    # deduplicate, so nothing upstream was filtering that out. Published once
    # from the late on_boot block instead.
    update_interval: never
    lambda: |-
      return {"$version"};

  #
  # Device Uptime
  #
  - platform: template
    name: Device Uptime
    icon: mdi:clock-start
    entity_category: diagnostic
    device_class: ""
    lambda: |-
          // The uptime sensor only publishes from update(), so its state is NaN
          // until the first poll. Test that BEFORE the cast: converting a NaN
          // float to int is undefined behaviour, and the guard this replaces
          // ("days > 3650") assumed the cast would yield a huge positive value.
          // It generally does not, so the fallback below never actually fired
          // and the first minute showed whatever the conversion happened to
          // produce.
          const float uptime = id(uptime_seconds_id).state;
          if (std::isnan(uptime)) {
            return {"Starting up"};
          }

          int seconds = (int) uptime;
          int days = seconds / (24 * 3600);

          seconds = seconds % (24 * 3600);

          int hours = seconds / 3600;
          seconds = seconds % 3600;

          int minutes = seconds /  60;
          seconds = seconds % 60;

          char buf[32];
          if (days) {
            snprintf(buf, sizeof(buf), "%dd %dh %dm %ds", days, hours, minutes, seconds);
          } else if (hours) {
            snprintf(buf, sizeof(buf), "%dh %dm %ds", hours, minutes, seconds);
          } else if (minutes) {
            snprintf(buf, sizeof(buf), "%dm %ds", minutes, seconds);
          } else {
            snprintf(buf, sizeof(buf), "%ds", seconds);
          }
          return {buf};

  #
  # WiFi Information
  # https://esphome.io/components/text_sensor/wifi_info
  #
  - platform: wifi_info
    ssid:
      name: SSID
      icon: mdi:wifi-star
    ip_address:
      id: ip_address_id
      name: IP Address
      icon: mdi:ip-network-outline
    dns_address:
      name: DNS Address
      icon: mdi:dns-outline

#
# https://esphome.io/components/binary_sensor
#
binary_sensor:

  #
  # Connection Status
  # https://esphome.io/components/binary_sensor/status
  #
  - platform: status
    name: Connection Status
    icon: mdi:connection

#
# https://esphome.io/components/button
#
button:

  #
  # https://esphome.io/components/button/restart
  #
  - platform: restart
    id: restart_id
    name: Restart
    icon: mdi:reload

  #
  # Clears every stored preference - the persisted hand colours included - and
  # drops the WiFi credentials, so the device comes back on the fallback AP.
  # https://esphome.io/components/button/factory_reset
  #
  - platform: factory_reset
    id: factoryreset_id
    name: Factory Reset
    icon: mdi:restart

  #
  # Reboots with all user components disabled, leaving only WiFi and OTA. The
  # way back in when a bad effect lambda takes the device down before it can be
  # flashed.
  # https://esphome.io/components/button/safe_mode
  #
  - platform: safe_mode
    id: safemode_id
    name: Restart (Safe Mode)
    icon: mdi:reload

#
# https://esphome.io/components/sensor
#
sensor:

  #
  # https://esphome.io/components/sensor/uptime
  #
  - platform: uptime
    id: uptime_seconds_id
    name: Uptime
    icon: mdi:timer-outline
    type: seconds
    internal: True
    entity_category: diagnostic
    device_class: ""

  #
  # Internal Temperature
  #
  # The SoC's own die sensor, not the enclosure. Added to turn "the chip feels
  # hot" into a number that can be compared before and after a change - the
  # C3's absolute maximum is 125 C, and anything up to ~60 C under load is
  # unremarkable for a QFN part with no heatsink.
  #
  # Read it against what the ring is doing: switch the light off from Home
  # Assistant and watch for ten minutes. If the temperature barely moves, the
  # heat is not coming from the ESP32 at all but from the LED supply path.
  #
  # Coordinates from Home Assistant
  #
  # Home Assistant keeps its own installation's location on zone.home. Importing
  # it means the Sun effect is right without anyone typing coordinates - and the
  # Latitude / Longitude text entities stay the single value the effect reads,
  # so nothing downstream has to know where the numbers came from.
  #
  # Requires the native API and this device added through the ESPHome
  # integration; over MQTT alone these never publish. That is the intended
  # fallback: with no Home Assistant the text entities simply keep their stored
  # value, and with no stored value the effect falls back to DEFAULT_LATITUDE
  # and DEFAULT_LONGITUDE.
  #
  # Consequence worth knowing: Home Assistant wins. Editing the text entities by
  # hand works, but the next time HA connects or zone.home changes it overwrites
  # them. Delete these two sensors if the device should keep its own coordinates.
  #
  # internal, because publishing them back to Home Assistant would only echo
  # what it already told us.
  #
  # https://esphome.io/components/sensor/homeassistant
  #
  - platform: homeassistant
    id: ha_latitude_id
    entity_id: zone.home
    attribute: latitude
    internal: true
    on_value:
      # The string comparison is not cosmetic: the text entities have
      # restore_value, so every write hits flash. zone.home republishes on each
      # reconnect with an unchanged value, and rewriting it every time would
      # wear the sector for nothing.
      - lambda: |-
          if (std::isnan(x)) {
            return;
          }
          char buf[16];
          snprintf(buf, sizeof(buf), "%.5f", x);
          if (id(latitude_text_id).state == buf) {
            return;
          }
          auto call = id(latitude_text_id).make_call();
          call.set_value(buf);
          call.perform();

  - platform: homeassistant
    id: ha_longitude_id
    entity_id: zone.home
    attribute: longitude
    internal: true
    on_value:
      - lambda: |-
          if (std::isnan(x)) {
            return;
          }
          char buf[16];
          snprintf(buf, sizeof(buf), "%.5f", x);
          if (id(longitude_text_id).state == buf) {
            return;
          }
          auto call = id(longitude_text_id).make_call();
          call.set_value(buf);
          call.perform();

  #
  # https://esphome.io/components/sensor/internal_temperature
  #
  - platform: internal_temperature
    id: internal_temperature_id
    name: Internal Temperature
    icon: mdi:thermometer
    entity_category: diagnostic
    update_interval: 60s

  #
  # https://esphome.io/components/sensor/wifi_signal
  #
  - platform: wifi_signal
    id: wifi_signal_db
    name: WiFi Signal (dBm)
    icon: mdi:wifi
    entity_category: diagnostic
    device_class: ""
    unit_of_measurement: "dBm"
    update_interval: 60s

  #
  # The same reading as a percentage, for people who do not read dBm. Derived
  # with copy rather than a second wifi_signal so both entities always agree.
  # https://esphome.io/components/sensor/copy
  #
  - platform: copy
    id: wifi_signal_percent
    name: WiFi Signal (%)
    icon: mdi:wifi
    source_id: wifi_signal_db
    unit_of_measurement: "%"
    entity_category: diagnostic
    device_class: ""
    filters:
      # std:: qualified: min/max are Arduino macros, and this device builds
      # against esp-idf where they do not exist
      - lambda: return std::min(std::max(2 * (x + 100.0), 0.0), 100.0);

  #
  # Ambient brightness from an LDR divider. Read by the Time effect, which dims
  # the whole face between AMBIENT_DARK and AMBIENT_BRIGHT.
  #
  # Published as plain volts. It used to multiply by 100 and call the result
  # "%", which it never was - that is volts times a hundred, and it made the
  # calibration values impossible to check against a multimeter.
  #
  # attenuation is spelled out because the schema default is 0db, which caps
  # the input at ~1.1 V. An LDR divider on 3.3 V spends most of its range above
  # that, so every reading from a half-lit room upwards clipped to the same
  # flat maximum - exactly the end of the scale the dimming needs to resolve.
  # 12db opens the range to ~0 - 3.1 V.
  #
  # https://esphome.io/components/sensor/adc
  #
  - platform: adc
    id: brightness_sensor
    name: Brightness sensor
    icon: mdi:brightness-6
    pin: ${PIN_BRIGHTNESS}
    attenuation: 12db
    accuracy_decimals: 3
    # Sampled once a second and averaged over 8 hardware reads, but only
    # published every fifth - so the traffic is the same 0.2 Hz as before while
    # the value behind it is a 20-second moving average.
    #
    # This is what makes dusk look like dusk. The Time effect reads .state, so
    # the face only changes brightness when this publishes: a single raw sample
    # every 5s made it step visibly, both from ADC noise and from a cloud
    # passing. Averaging shrinks each step to roughly a fifth. The cost is
    # latency - switching a lamp on takes ~20s to fully register, which for a
    # clock is a feature.
    update_interval: 1s
    samples: 8
    filters:
      - sliding_window_moving_average:
          window_size: 20
          send_every: 5

  #
  # Reset Count
  #
  # Pushed once from the late on_boot block, see reset_count_id for why the
  # increment cannot happen there too.
  #
  - platform: template
    id: reset_count_sensor_id
    name: Reset Count
    icon: mdi:restart-alert
    state_class: total_increasing
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      return id(reset_count_id);

#
# https://esphome.io/components/switch/template
#
switch:

  #
  # Kept optimistic on purpose: the state lives in global_enable_seconds, which
  # the effect reads at frame rate, so there is nothing to read back from.
  #
  # restore_mode is spelled out because the schema default is ALWAYS_OFF - the
  # setting was silently lost on every reboot. Restoring also re-runs
  # turn_on_action, so the global gets seeded from the stored state and the
  # global itself does not need to persist.
  #
  - platform: template
    name: Enable seconds
    icon: mdi:clock-outline
    id: infinity_enable_seconds
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      then:
        lambda: |-
          id(global_enable_seconds) = 1;
    turn_off_action:
      then:
        lambda: |-
          id(global_enable_seconds) = 0;

#
# Hand colours as "#RRGGBB". These entities ARE the stored value - the Time
# effect reads id(...).state directly and parses it, so there is no global to
# keep in sync and no set_action to write one. That replaces the previous
# arrangement, where three restoring globals shadowed these three entities and
# nothing ever read either side.
#
# restore_value persists the user's palette across a power cut; initial_value
# only applies on the very first boot. min_length is 7 as well as max_length:
# anything shorter cannot be a valid #RRGGBB, and rejecting it in the schema is
# better than silently falling back in the effect on every frame.
#
# https://esphome.io/components/text/template
#
text:

  - platform: template
    name: Color hour
    icon: mdi:palette
    id: infinity_color_hour
    mode: text
    optimistic: true
    restore_value: true
    min_length: 7
    max_length: 7
    initial_value: '#FF0000'

  - platform: template
    name: Color minute
    icon: mdi:palette
    id: infinity_color_minute
    mode: text
    optimistic: true
    restore_value: true
    min_length: 7
    max_length: 7
    initial_value: '#00FF00'

  - platform: template
    name: Color second
    icon: mdi:palette
    id: infinity_color_second
    mode: text
    optimistic: true
    restore_value: true
    min_length: 7
    max_length: 7
    initial_value: '#0000FF'

  #
  # Where the device is, in decimal degrees, north and east positive. The Sun
  # effect computes the real solar elevation from these, so they decide when the
  # ring starts to light and how far it opens.
  #
  # Text rather than number entities because a number would need a fixed step
  # and these want free decimals; and text so they can be corrected from Home
  # Assistant without a reflash. Anything unparseable or out of range falls back
  # to DEFAULT_LATITUDE / DEFAULT_LONGITUDE rather than throwing away the frame.
  #
  - platform: template
    name: Latitude
    icon: mdi:latitude
    id: latitude_text_id
    mode: text
    optimistic: true
    restore_value: true
    entity_category: config
    min_length: 1
    max_length: 12
    initial_value: '${DEFAULT_LATITUDE}'

  - platform: template
    name: Longitude
    icon: mdi:longitude
    id: longitude_text_id
    mode: text
    optimistic: true
    restore_value: true
    entity_category: config
    min_length: 1
    max_length: 12
    initial_value: '${DEFAULT_LONGITUDE}'

#
# The option ORDER is load-bearing: the Time effect switches on
# active_index(), and its FACETYPE_* / INDICATOR_* constants are the positions
# in these lists. Reordering or inserting an option silently remaps the face.
#
# restore_value on both: without it the schema default is false and every reboot
# reset the face to Normal / None. initial_option only applies on the very first
# boot now, or after a factory reset.
#
# https://esphome.io/components/select/template
#
select:

  - platform: template
    name: Face type
    icon: mdi:clock-time-two-outline
    id: infinity_face_type
    options:
      - "Normal"
      - "Darken to midday"
    initial_option: "Normal"
    optimistic: true
    restore_value: true

  # The first option is "Off" and NOT "None" on purpose. Home Assistant's MQTT
  # integration treats the literal payload "None" as its PAYLOAD_NONE sentinel,
  # meaning "no state" - an MQTT select sitting on that value reads as "unknown"
  # in the UI instead of showing the selected entry. Renaming is safe here
  # because the Time effect switches on active_index(), and restore_value
  # stores the index too, so nothing depends on the string.
  - platform: template
    name: Indicator
    icon: mdi:form-select
    id: infinity_indicator
    options:
      - "Off"
      - "Show midday"
      - "Show quadrants"
      - "Show hour marks"
    initial_option: "Off"
    optimistic: true
    restore_value: true

  #
  # Effect
  #
  # The light entity already carries the effect list natively - Home Assistant
  # shows it in the more-info dialog of "LED color". This select is a
  # convenience wrapper so the effect can sit on a dashboard as its own control
  # and be addressed from an automation without a light.turn_on service call.
  #
  # Every option name must match an effect name below EXACTLY - set_action
  # passes the string straight to light.turn_on. The one exception is "Off",
  # which is handled before that and translated in both directions by the
  # light's on_state handler.
  #
  - platform: template
    name: Effect
    icon: mdi:auto-fix
    id: effect_select_id
    options:
      - "Off"
      - "Time"
      - "Fire"
      - "Alarm"
      - "Sun"
      - "Moon"
      - "Rainbow"
      - "Color Wipe"
      - "Scan"
      - "Twinkle"
      - "Random Twinkle"
      - "Fireworks"
      - "Addressable Flicker"
    initial_option: "Time"
    optimistic: true
    restore_value: true
    set_action:
      # "Off" switches the ring off rather than selecting the absence of an
      # effect. ESPHome calls that entry "None" and means "render the light's
      # plain colour" by it - and that colour is white here, since on_boot and
      # on_turn_on both set red, green and blue to IDLE_*. Picking it lit the
      # whole ring white, which is not what the entry suggests.
      #
      # The rename to "Off" is also what keeps the entity readable in Home
      # Assistant: its MQTT integration treats the literal payload "None" as
      # PAYLOAD_NONE, i.e. "no state", so a select resting on it shows up as
      # "unknown". The light's on_state handler translates between the two
      # names, so ESPHome's "None" and this "Off" stay in step.
      - if:
          condition:
            lambda: return x == "Off";
          then:
            - light.turn_off:
                id: led_ring_id
          else:
            - light.turn_on:
                id: led_ring_id
                effect: !lambda return x;

#
# The clock face itself. Every animation below is an addressable_lambda rather
# than an external component or a header in esphome.includes, which keeps the
# whole device in this one file.
#
# https://esphome.io/components/light/esp32_rmt_led_strip
#
light:
  - platform: esp32_rmt_led_strip
    id: led_ring_id
    name: LED color
    icon: mdi:led-outline
    chipset: WS2811
    rgb_order: GRB
    pin: ${PIN_LED_RING}
    num_leds: ${NUM_LEDS}
    default_transition_length: 1s

    # The schema default is 2.8, which is right for a light you dim by hand: it
    # makes the dimmer curve look linear to the eye. It is wrong here, because
    # every effect below computes its own gradient - gamma is then applied on
    # top of maths that already decided what each pixel should look like, and it
    # crushes the dark end of the hour/minute blend into black. 1.0 hands the
    # computed value straight to the LED.
    gamma_correct: 1.0

    effects:

      #
      # The clock face. Hour and minute hand are drawn as a gradient around the
      # ring, so the two arcs between them carry the reading even when a hand
      # sits behind the other.
      #
      - addressable_lambda:
          name: Time
          # The smallest thing shown is a second, so anything faster is wasted
          # work. Left at the 0ms default this lambda re-rendered 60 pixels on
          # every main-loop pass - thousands of times a second for a display
          # that changes once a second.
          update_interval: 500ms
          lambda: |-
            // face types
            constexpr int FACETYPE_NORMAL = 0;
            constexpr int FACETYPE_DARKEN_TO_MIDDAY = 1;

            // indicators
            constexpr int INDICATOR_SHOW_NONE = 0;
            constexpr int INDICATOR_SHOW_MIDDAY = 1;
            constexpr int INDICATOR_SHOW_QUADRANTS = 2;
            constexpr int INDICATOR_SHOW_HOUR_MARKS = 3;

            auto linearBlend = [](Color left, Color right, float progress) -> Color {
              return Color(left.r + ((right.r - left.r) * progress),
                           left.g + ((right.g - left.g) * progress),
                           left.b + ((right.b - left.b) * progress));
            };

            // Scales a colour towards black. Multiplicative on purpose - see
            // MIDDAY_DARKEN for why subtracting a fixed delta was wrong.
            auto darken = [](Color color, float factor) -> Color {
              return Color(color.r * factor, color.g * factor, color.b * factor);
            };

            // set the LED to the inverse of the two LEDs next to it, showing as white on the main face
            auto invertLED = [&](int32_t i) {
              Color averagecolor = linearBlend(it[(i - 1 + it.size()) % it.size()].get(),
                                               it[(i + 1) % it.size()].get(), 0.5f);
              averagecolor = Color(255 - averagecolor.r, 255 - averagecolor.g, 255 - averagecolor.b);
              it[i] = averagecolor;
            };

            // Reads "#RRGGBB" from a Color * text entity. Parsed per frame on
            // purpose: it is a handful of instructions, and it means an edit in
            // Home Assistant shows on the next frame without any cache to
            // invalidate. Anything unparseable falls back rather than throwing
            // away the frame.
            auto parseColor = [](const std::string &hex, Color fallback) -> Color {
              if (hex.length() != 7 || hex[0] != '#') {
                return fallback;
              }
              char *end = nullptr;
              const long value = strtol(hex.c_str() + 1, &end, 16);
              if (end != hex.c_str() + 7) {
                return fallback;
              }
              return Color((value >> 16) & 0xFF, (value >> 8) & 0xFF, value & 0xFF);
            };

            auto time = id(sntp_time).now();

            const float blendPoint = 0.5;

            int hour = time.hour;
            int minute = time.minute;
            int second = time.second;

            if (!time.is_valid()) {
              if (id(global_debug) < 1) {
                ESP_LOGE("lambda", "Got invalid time from sntp_time. Time is: %i:%i", hour, minute);
                id(global_debug) = 1;
              }
              return;
            }

            // Pixel positions on the ring. An index is a MINUTE, so the hour
            // hand belongs at (hour % 12) * 5 - the extra minute/12 makes it
            // creep forward through the hour instead of jumping on the hour,
            // the way a real hour hand moves.
            //
            // This used to index the ring with time.hour directly. On a 60
            // pixel dial that put the hour hand at "hour minutes past": pixel 9
            // at 09:45 where it belongs at 48, pixel 23 at 23:00 where it
            // belongs at 55. It was only ever right at midnight, and it never
            // left the top half of the dial. Worse, firsthand/secondhand below
            // then compared an 0-23 hour against an 0-59 minute - two different
            // units - so which hand counted as "first", and with it the whole
            // gradient, was decided by a meaningless comparison.
            const int hour_pos = ((hour % 12) * 60 + minute) / 12;
            const int minute_pos = minute;

            auto face_type = id(infinity_face_type).active_index();
            auto indicator = id(infinity_indicator).active_index();
            auto enable_seconds = id(global_enable_seconds);

            // this face colours the clock in 2 sections, the c1->c2 divide
            // represents the minute hand and the c2->c1 divide represents the hour hand.
            Color c1;
            Color c1blend;
            Color c2;
            Color c2blend;

            int gap;
            int firsthand = std::min(hour_pos, minute_pos);
            int secondhand = std::max(hour_pos, minute_pos);

            Color hour_color = parseColor(id(infinity_color_hour).state, Color(255, 0, 0));
            Color minute_color = parseColor(id(infinity_color_minute).state, Color(0, 255, 0));
            Color second_color = parseColor(id(infinity_color_second).state, Color(0, 0, 255));

            // check which hand is first, so we know what colour the 0 pixel is
            //
            // The else branch used to build c1 as (r, b, g) - green and blue
            // swapped. That was invisible while hour_color was hard-coded pure
            // red, but the colour is user-supplied now, so any hand colour with
            // two components would have rendered differently depending on
            // whether the hour or the minute hand came first.
            if (hour_pos > minute_pos) {
              c2 = Color(hour_color.r, hour_color.g, hour_color.b);
              c1 = Color(minute_color.r, minute_color.g, minute_color.b);
            } else {
              c1 = Color(hour_color.r, hour_color.g, hour_color.b);
              c2 = Color(minute_color.r, minute_color.g, minute_color.b);
            }

            // The blending is the colour that the hour/minute colour will meet.
            // The greater the blend, the closer to the actual hour/minute colour it gets.
            c2blend = linearBlend(c2, c1, (float) blendPoint / 255);
            c1blend = linearBlend(c1, c2, (float) blendPoint / 255);

            gap = secondhand - firsthand;

            // create the blend between first and 2nd hand
            for (int i = firsthand; i < secondhand; i++) {
              it[i] = linearBlend(c2blend, c2, ((float) i - (float) firsthand) / (float) gap);
            }

            gap = it.size() - gap;

            // and the last hand
            for (int i = secondhand; i < it.size() + firsthand; i++) {
              it[i % it.size()] = linearBlend(c1blend, c1, ((float) i - (float) secondhand) / (float) gap);
            }

            it[hour_pos] = hour_color;
            it[minute_pos] = minute_color;

            // face types
            switch (face_type.value()) {
              default:
                break;
              case FACETYPE_NORMAL:
                break;
              case FACETYPE_DARKEN_TO_MIDDAY: {
                // Darkens everything between the trailing hand and midday
                // (pixel 0), so the eye is drawn to the arc the hands span.
                //
                // Starts at secondhand + 1, not at secondhand: that pixel IS
                // the trailing hand, and including it darkened the hand away.
                // At 15:07 the hour hand was the trailing one and simply
                // vanished.
                for (int i = secondhand + 1; i < it.size(); i++) {
                  it[i] = darken(it[i].get(), ${MIDDAY_DARKEN}f);
                }
                break;
              }
            }

            // indicator
            switch (indicator.value()) {
              default:
                break;
              case INDICATOR_SHOW_NONE:
                break;
              case INDICATOR_SHOW_MIDDAY:
                // shows a bright light at midday to orient the user
                invertLED(0);
                break;
              case INDICATOR_SHOW_QUADRANTS:
                for (int i = 0; i < 4; i++) {
                  invertLED(i * it.size() / 4);
                }
                break;
              case INDICATOR_SHOW_HOUR_MARKS:
                for (int i = 0; i < 12; i++) {
                  invertLED(i * it.size() / 12);
                }
                break;
            }

            if (enable_seconds) {
              it[second] = second_color;
            }

            // Ambient dimming, applied once over the finished frame. Doing it
            // here rather than per-draw is what the four separate ToDo markers
            // in this lambda used to ask for, and it is also more correct: the
            // gradient, both hands and the inverted indicator pixels all go
            // through the same factor, so the face keeps its contrast as it
            // dims instead of the indicators staying bright against a dark ring.
            //
            // NaN until the adc has published once - leave the frame alone then
            // rather than multiplying by garbage.
            const float ambient = id(brightness_sensor).state;
            if (!std::isnan(ambient)) {
              // Swapping AMBIENT_DARK and AMBIENT_BRIGHT inverts this mapping,
              // which is the documented fix for a divider wired the other way
              // round - the subtraction handles a negative span on its own.
              const float span = ${AMBIENT_BRIGHT}f - ${AMBIENT_DARK}f;
              float t = (span == 0.0f) ? 1.0f : (ambient - ${AMBIENT_DARK}f) / span;
              t = std::min(std::max(t, 0.0f), 1.0f);

              const float dim = ${MIN_FACE_BRIGHTNESS}f + (1.0f - ${MIN_FACE_BRIGHTNESS}f) * t;
              for (int i = 0; i < it.size(); i++) {
                const Color c = it[i].get();
                it[i] = Color(c.r * dim, c.g * dim, c.b * dim);
              }
            }
      #
      # Fire simulation, mirrored across both halves of the ring.
      #
      - addressable_lambda:
          name: Fire
          # The cooling/diffusion model assumes a fixed step rate - the original
          # had a speedDelay parameter for exactly this. Running it once per
          # main-loop pass burns the heat buffer down far faster than the sparks
          # can refill it, which looks like noise rather than flames.
          update_interval: 30ms
          lambda: |-
            // All three are tunable at the top of this file, with the reasoning
            // for the values on the substitutions themselves.
            constexpr int cooling = ${FIRE_COOLING};
            constexpr int sparking = ${FIRE_SPARKING};
            constexpr uint8_t maxHeat = ${FIRE_MAX_HEAT};

            constexpr int MAX_PIXELS = 128;

            int numPixels = it.size() / 2;
            if (numPixels > MAX_PIXELS) {
              numPixels = MAX_PIXELS;
            }

            // has to survive between frames, otherwise cooling and diffusion
            // operate on a fresh (uninitialised) buffer every single frame
            static uint8_t heat[MAX_PIXELS] = {};
            static uint16_t rand16seed = 0;

            // Without this the seed is 0 on every boot and the fire replays the
            // exact same sequence of sparks each time - identical flames after
            // every restart.
            if (initial_run) {
              rand16seed = (uint16_t) millis();
            }

            // Generate an 8-bit random number
            auto random8 = [&]() -> uint8_t {
              rand16seed = (rand16seed * (uint16_t) 2053) + (uint16_t) 13849;
              // return the sum of the high and low bytes, for better
              // mixing and non-sequential correlation
              return (uint8_t)(((uint8_t)(rand16seed & 0xFF)) + ((uint8_t)(rand16seed >> 8)));
            };

            // Generate an 8-bit random number between 0 and lim
            auto random8_max = [&](uint8_t lim) -> uint8_t {
              return ((uint16_t) random8() * lim) >> 8;
            };

            // Generate an 8-bit random number in the given range
            auto random8_range = [&](uint8_t min_value, uint8_t lim) -> uint8_t {
              return random8_max(lim - min_value) + min_value;
            };

            // subtract one byte from another, saturating at 0x00
            auto qsub8 = [](uint8_t i, uint8_t j) -> uint8_t {
              int t = i - j;
              return (t < 0) ? 0 : t;
            };

            // add one byte to another, saturating at 0xFF
            auto qadd8 = [](uint8_t i, uint8_t j) -> uint8_t {
              unsigned int t = i + j;
              return (t > 255) ? 255 : t;
            };

            auto getHeatColor = [](uint8_t temperature) -> Color {
              Color heatcolor = Color(0, 0, 0);

              // Scale 'heat' down from 0-255 to 0-191,
              // which can then be easily divided into three
              // equal 'thirds' of 64 units each.
              uint8_t t192 = std::round((temperature / 255.0) * 191);

              // calculate a value that ramps up from
              // zero to 255 in each 'third' of the scale.
              uint8_t heatramp = t192 & 0x3F; // 0..63
              heatramp <<= 2;                 // scale up to 0..252

              // now figure out which third of the spectrum we're in:
              if (t192 & 0x80) {
                // we're in the hottest third
                heatcolor.r = 255;      // full red
                heatcolor.g = 255;      // full green
                heatcolor.b = heatramp; // ramp up blue
              } else if (t192 & 0x40) {
                // we're in the middle third
                heatcolor.r = 255;      // full red
                heatcolor.g = heatramp; // ramp up green
                heatcolor.b = 0;        // no blue
              } else {
                // we're in the coolest third
                heatcolor.r = heatramp; // ramp up red
                heatcolor.g = 0;        // no green
                heatcolor.b = 0;        // no blue
              }

              return heatcolor;
            };

            // Step 1. Cool down every cell a little
            for (int i = 0; i < numPixels; i++) {
              heat[i] = qsub8(heat[i], random8_range(0, ((cooling * 10) / numPixels) + 2));
            }

            // Step 2. Heat from each cell drifts 'up' and diffuses a little
            for (int k = numPixels - 1; k >= 2; k--) {
              heat[k] = (heat[k - 1] + heat[k - 2] + heat[k - 2]) / 3;
            }

            // Step 3. Randomly ignite new 'sparks' of heat near the bottom
            if (random8() < sparking) {
              int y = random8_max(7);
              heat[y] = qadd8(heat[y], random8_range(160, 255));
            }

            // Step 4. Map from heat cells to LED colors, mirrored across the
            // ring: the base sits at numPixels - 1 / numPixels and the two
            // flames rise in opposite directions to meet at 0 / size - 1.
            //
            // The second index used to be numPixels - j, which covered
            // numPixels down to 1 - so pixel 0 was never written at all and
            // kept whatever the previous effect had left there, while pixel
            // numPixels got written twice. The stale pixel sat exactly where
            // the two flame tips meet, which is where it showed most.
            for (int j = 0; j < numPixels; j++) {
              // calculate color temperature, clamped short of the white end of
              // the palette - see FIRE_MAX_HEAT
              Color color = getHeatColor(std::min(heat[j], maxHeat));

              // forward the flames
              it[numPixels + j] = color;
              // reverse the flames
              it[numPixels - 1 - j] = color;
            }
      #
      # Red pulse.
      #
      - addressable_lambda:
          name: Alarm
          update_interval: 30ms
          lambda: |-
            // The original ran both ramps, 0 -> 255 and back, inside a single
            // call. Nothing is shown between writes to the frame buffer, so only
            // the last pass survived - the strip rendered flat black and the
            // effect did nothing at all. The ramp has to advance one step per
            // FRAME, which is what the counter below does.
            //
            // 8 per 30ms frame is ~1s per ramp, so a full pulse takes ~2s.
            constexpr int STEP = 8;

            static int level = 0;
            static int direction = 1;

            if (initial_run) {
              level = 0;
              direction = 1;
            }

            level += direction * STEP;

            if (level >= 255) {
              level = 255;
              direction = -1;
            } else if (level <= 0) {
              level = 0;
              direction = 1;
            }

            const Color color = Color(level, 0, 0);
            for (int i = 0; i < it.size(); i++) {
              it[i] = color;
            }
      #
      # Real-time simulation of the sun. The ring lights at 12 o'clock the
      # moment the sun clears the horizon and opens outwards from there as it
      # climbs, reaching the full circle at solar noon; the colour follows the
      # sun's own, red at the horizon through orange and yellow to daylight.
      # Below the horizon the ring is dark.
      #
      # This replaces a ramp that ran on its own frame counter over a fixed
      # duration and had nothing to do with the sky.
      #
      - addressable_lambda:
          name: Sun
          # The sun moves about 0.004 degrees per second. Over ten seconds that
          # is far less than one pixel of arc, so anything faster would only
          # burn cycles - and this lambda is the one piece of real floating
          # point trigonometry in the config.
          update_interval: 10s
          lambda: |-
            auto time = id(sntp_time).now();

            if (!time.is_valid()) {
              for (int i = 0; i < it.size(); i++) {
                it[i] = Color(0, 0, 0);
              }
              return;
            }

            // Reads a coordinate from its text entity. Anything unparseable,
            // out of range or non-finite falls back to the compiled default -
            // this runs every frame, so it must never throw the frame away.
            auto parseCoord = [](const std::string &s, float fallback, float limit) -> float {
              if (s.empty()) {
                return fallback;
              }
              char *end = nullptr;
              const float v = strtof(s.c_str(), &end);
              if (end == s.c_str() || !std::isfinite(v) || v < -limit || v > limit) {
                return fallback;
              }
              return v;
            };

            const double lat = parseCoord(id(latitude_text_id).state, ${DEFAULT_LATITUDE}f, 90.0f);
            const double lon = parseCoord(id(longitude_text_id).state, ${DEFAULT_LONGITUDE}f, 180.0f);

            constexpr double DEG = 0.017453292519943295;
            constexpr double RAD = 57.29577951308232;

            // Low-precision solar position from the Astronomical Almanac. Good
            // to well under a tenth of a degree, which is a hundred times finer
            // than one pixel of this ring.
            //
            // timestamp is UTC, which is what this needs - the Europe/Berlin
            // timezone on the sntp component only affects the clock face.
            const double jd = (double) time.timestamp / 86400.0 + 2440587.5;
            const double n = jd - 2451545.0;

            double meanLong = std::fmod(280.460 + 0.9856474 * n, 360.0);
            double meanAnom = std::fmod(357.528 + 0.9856003 * n, 360.0);
            if (meanLong < 0.0) meanLong += 360.0;
            if (meanAnom < 0.0) meanAnom += 360.0;

            // ecliptic longitude, with the two largest terms of the equation of centre
            const double eclLong = meanLong + 1.915 * std::sin(meanAnom * DEG)
                                            + 0.020 * std::sin(2.0 * meanAnom * DEG);
            const double obliq = 23.439 - 0.0000004 * n;

            const double decl = std::asin(std::sin(obliq * DEG) * std::sin(eclLong * DEG)) * RAD;
            const double ra = std::atan2(std::cos(obliq * DEG) * std::sin(eclLong * DEG),
                                         std::cos(eclLong * DEG)) * RAD;

            double gmst = std::fmod(18.697374558 + 24.06570982441908 * n, 24.0);
            if (gmst < 0.0) gmst += 24.0;

            double hourAngle = std::fmod(gmst * 15.0 + lon - ra, 360.0);
            if (hourAngle < -180.0) hourAngle += 360.0;
            if (hourAngle > 180.0) hourAngle -= 360.0;

            const double elevation = std::asin(std::sin(lat * DEG) * std::sin(decl * DEG) +
                                               std::cos(lat * DEG) * std::cos(decl * DEG) *
                                               std::cos(hourAngle * DEG)) * RAD;

            // below the horizon there is no sun to show
            if (elevation <= 0.0) {
              for (int i = 0; i < it.size(); i++) {
                it[i] = Color(0, 0, 0);
              }
              return;
            }

            // How high the sun gets today at this latitude: at solar noon the
            // hour angle is 0 and the elevation works out to 90 - |lat - decl|.
            // Normalising against it means the ring closes at local noon on any
            // day of the year, rather than only in midsummer.
            const double maxElevation = 90.0 - std::fabs(lat - decl);
            const float spread = (maxElevation > 0.0)
                                   ? (float) std::min(elevation / maxElevation, 1.0)
                                   : 0.0f;

            // Colour by elevation, over the same red - orange - yellow - white
            // curve the old ramp used. Its segment boundaries at 142, 204 and
            // 280 are what give the sunrise its shape, so they are kept and only
            // the input changed: elevation instead of a frame counter.
            const int i = (int) (std::min(elevation / ${SUN_WHITE_ELEVATION}f, 1.0) * 280.0);

            int red_ramp = std::max(142, i);

            int green_ramp;
            if (i < 142) {
              green_ramp = i * 64 / 142;
            } else if (i < 204) {
              green_ramp = 64 + (i - 142) * 128 / 62;
            } else {
              green_ramp = 192 + (i - 204) * 64 / 51;
            }

            int blue_ramp = (i > 204) ? (5 * i - 1020) : 0;

            red_ramp = std::min(red_ramp, 255);
            green_ramp = std::min(green_ramp, 255);
            blue_ramp = std::min(blue_ramp, 255);

            const Color sky = Color(red_ramp, green_ramp, blue_ramp);

            // The arc is centred on pixel 0 - 12 o'clock - and opens both ways.
            // Same antialiased edge as the Moon effect: the boundary pixel is
            // dimmed by the fractional part, so the light creeps outwards
            // smoothly instead of stepping a whole pixel at a time, and the +1
            // closes the ring at noon instead of leaving the pixel opposite
            // dark.
            const float half = spread * (float) it.size() / 2.0f;

            for (int j = 0; j < it.size(); j++) {
              int d = j;
              if (d > it.size() / 2) {
                d = it.size() - d;
              }

              const float level = std::min(std::max(half - (float) d + 1.0f, 0.0f), 1.0f);
              it[j] = Color(sky.r * level, sky.g * level, sky.b * level);
            }

      #
      # Current moon phase as a lit segment.
      #
      - addressable_lambda:
          name: Moon
          # the phase moves once a day; 1s is already far more often than needed
          update_interval: 1s
          lambda: |-
            auto time = id(sntp_time).now();

            if (!time.is_valid()) {
              return;
            }

            // The renderer below wants "days into the lunar cycle", 0..29. The
            // original computed that with integer arithmetic on the raw epoch:
            // "(timestamp - 518400) % 2551443 / 86400". Two things were wrong
            // with it - 518400 (6 days) is not a new moon reference, and
            // 2551443 seconds is the synodic month, so the modulo left seconds
            // into the cycle and the division by a day gave 0..29 only by
            // accident of the wrong epoch. It tracked nothing in the sky.
            //
            // Reference new moon: 2000-01-06 18:14 UTC, the standard epoch for
            // this calculation. The synodic month is 29.530588853 days.
            constexpr double SYNODIC_MONTH_DAYS = 29.530588853;
            constexpr double REFERENCE_NEW_MOON = 947182440.0;

            const double days = (time.timestamp - REFERENCE_NEW_MOON) / 86400.0;
            double cycles = days / SYNODIC_MONTH_DAYS;
            cycles -= std::floor(cycles);

            // Illuminated fraction of the disc: 0 at new moon, 1 at full. The
            // ring shows exactly that fraction of itself, so full moon is a
            // closed circle and new moon is dark.
            //
            // This replaces a triangular approximation - "(14 - |14 - phase|)"
            // scaled to the ring, minus a sixth - which grew the crescent at a
            // constant rate and, worse, never reached zero: its fade-in edge did
            // not depend on the phase at all, so ten pixels stayed lit at every
            // phase including new moon. The cosine is both shorter and correct:
            // the moon changes slowly around new and full and quickly around the
            // quarters, which is what you actually see in the sky.
            constexpr float TWO_PI_F = 6.283185307179586f;
            const float illuminated = (1.0f - std::cos(TWO_PI_F * (float) cycles)) / 2.0f;

            // in pixels, fractional so the arc grows smoothly across the month
            const float lit = illuminated * (float) it.size();

            // The lit limb faces the sun: right while waxing, left while waning.
            // At full moon the arc closes and the centre stops mattering.
            const int centre = (cycles < 0.5) ? (it.size() / 4) : (3 * it.size() / 4);

            for (int i = 0; i < it.size(); i++) {
              // distance from the centre of the arc, the short way round
              int d = std::abs(i - centre);
              if (d > it.size() / 2) {
                d = it.size() - d;
              }

              // The arc covers lit pixels in total, so lit/2 either side. The
              // +1 closes the ring at full moon - without it the single pixel
              // opposite the centre stays dark and leaves a visible gap. The
              // fractional result dims the boundary pixel, which is what keeps
              // a crescent from stepping a whole pixel at a time.
              float level = 0.0f;
              if (lit >= 1.0f) {
                level = std::min(std::max(lit / 2.0f - (float) d + 1.0f, 0.0f), 1.0f);
              }

              const uint8_t v = (uint8_t) (${MOON_BRIGHTNESS} * level);
              it[i] = Color(v, v, v);
            }
