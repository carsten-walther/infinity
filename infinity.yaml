    # Keeps the Effect select in step when the effect is changed anywhere else -
    # from the light entity itself, from on_boot, or from on_turn_on below.
    #
    # publish_state, NOT make_call: a call would run the select's set_action,
    # which calls light.turn_on, which fires on_state again. publish_state only
    # updates the reported value, so the loop cannot start. The equality check
    # additionally keeps this from republishing on every unrelated light state
    # change - brightness, colour, on/off all land here too.
    on_state:
      - lambda: |-
          // ESPHome reports "None" when no effect is running, the light being
          // off included. The select calls that entry "Off" - see the comment
          // on its set_action for why - so translate here rather than letting
          // the two drift apart.
          const std::string effect = id(led_ring_id).get_effect_name().str();
          const std::string option = (effect == "None") ? "Off" : effect;
          if (id(effect_select_id).current_option().str() != option &&
              id(effect_select_id).has_option(option)) {
            id(effect_select_id).publish_state(option);
          }

    # Switching the light on always lands on the clock face at a known
    # brightness, whatever effect or colour was last set from Home Assistant.
    on_turn_on:
      - light.turn_on:
          id: led_ring_id
          brightness: ${DEFAULT_BRIGHTNESS}
          red: ${IDLE_RED}
          green: ${IDLE_GREEN}
          blue: ${IDLE_BLUE}
          effect: Time
