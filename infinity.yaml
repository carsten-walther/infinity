# ═══════════════════════════════════════════════════════════
#  Infinity
#  Analogue Clock with NeoPixels | MQTT | Home Assistant
# ═══════════════════════════════════════════════════════════

# Pinout: https://randomnerdtutorials.com/esp32-c3-pinout-reference-gpios/

substitutions:

  project_name: infinity
  author_name: carsten-walther
  friendly_name: Infinity
  comment: Just another analogue clock
  version: 2026.8.19
  area: Miscellaneous

  #
  # GPIOs
  #
  # The i2c bus to the DS1307. GPIO6 and GPIO7 are free pins on this board:
  # not strapping (that is GPIO2, GPIO8 and GPIO9 on the C3), not ADC, and
  # not flash - the MINI-1 module carries its flash in-package on GPIO11-17,
  # which is what leaves 6, 7 and 10 with no second job.
  #
  # That matters more for i2c than for anything else here. An idle i2c line
  # sits HIGH on its pull-ups, but the pull-ups belong to the RTC module: a
  # bus held low by an unpowered or miswired module is indistinguishable
  # from a pull-down, and on a strapping pin that means booting into the ROM
  # bootloader instead of into the firmware. On GPIO6/GPIO7 the same fault
  # is merely a bus error.
  #
  PIN_I2C_SDA: GPIO06
  PIN_I2C_SCL: GPIO07

  # GPIO10 is one of the few pins on this board with no second job: no
  # strapping function, no ADC channel, no flash, no USB, no UART. GPIO02 - the
  # previous choice - is a strapping pin. It worked, because the pin is
  # high-impedance at reset and a WS2811 data input does not pull it down, but
  # a level shifter, a pulldown or a long noisy cable turns that into a device
  # that boots into download mode now and then.
  PIN_LED: GPIO10

  # ADC1 channel 1. Only GPIO00, GPIO01, GPIO03 and GPIO04 are usable analogue
  # inputs here: everything else is either taken or on ADC2, which the C3
  # cannot read while WiFi is up.
  PIN_ADC: GPIO01

  #
  # LED ring
  #
  # 60 is not a decorative choice: one pixel per minute means a pixel index IS
  # the minute (and second) value, and the hour hand belongs at (hour % 12) * 5.
  # Every effect below and all of the indicator maths assume that mapping, so
  # changing this number alone does not produce a working clock.
  #
  NUM_LEDS: "60"

  #
  # How far the "Gradient" face dims its two colour ramps, as a fraction. The
  # hands themselves are painted at full strength on top, so this is what makes
  # them stand out - at 1.0 they dissolve into the ramp they sit in the middle
  # of, because a gradient is by definition nearly the same colour either side
  # of any point on it.
  #
  GRADIENT_DIM: "0.35"

  #
  # How wide the "Normal" face's two ramps are, as a fraction 0..1.
  #
  # Each arc starts at its own hand's colour pulled this far towards the other
  # hand's colour, and ends on the full colour at the far end. 0 gives two flat
  # arcs meeting at the hands, 1 makes both arcs start on the same colour and
  # the two hands become the only thing telling them apart.
  #
  # Needs a decimal point: the lambda appends "f" to build a float literal.
  #
  FACE_BLEND: "0.5"

  #
  # Brightness the clock comes back to on boot and on every switch-on. 60 LEDs
  # at full white draw around 3.6 A - the ring runs on its own supply here, so
  # that is a question for the power brick rather than for the board, but it is
  # also far brighter than a room needs.
  #
  DEFAULT_BRIGHTNESS: "70%"

  #
  # Resting colour
  #
  # The colour the ring carries underneath the effects. Every effect here writes
  # its pixels directly and ignores it, so it is only visible in one situation:
  # no effect running with the light on, which is reached by picking "None" from
  # the LED color entity's own effect list. It is also what the light fades
  # through when an effect starts.
  #
  # Flat white, all three channels equal. Note that gamma_correct is 1.0 on
  # this light, so these percentages go to the LEDs linearly and not corrected
  # for perception - low values come out brighter than they read here. Pulling
  # blue down is what gives a warm white; nothing here depends on that, so it
  # is left to whoever wants it.
  #
  IDLE_RED: "100%"
  IDLE_GREEN: "100%"
  IDLE_BLUE: "100%"

  #
  # Ambient light calibration
  #
  # The voltage the LDR divider on ${PIN_ADC} produces at the two ends
  # of the range the face should react to. The Time effect maps anything in
  # between onto a linear dim factor and clamps outside it. Volts, matching
  # what the Brightness sensor publishes.
  #
  # Measured on the built device (2026-08-16):
  #   LDR covered          0.09 V
  #   normal room light    0.93 V
  #   torch on the sensor  2.96 V
  #
  # Note these are NOT the measured extremes. The full span 0.09 - 2.96 V would
  # put every indoor level in the bottom third of the scale, and the clock
  # would sit at ~40% brightness in a normally lit room. An LDR divider is
  # heavily non-linear and most of its swing sits above anything a living room
  # ever reaches, so the useful window is the indoor band: 1.20 V is treated as
  # "bright enough for full brightness" and anything above it clamps there.
  # Widen AMBIENT_BRIGHT if the clock stays too bright in the evening.
  #
  # If the clock dims the wrong way round, the photoresistor sits on the other
  # leg of the divider: SWAP these two values, no code change needed. Measured
  # polarity here is dark = low, bright = high, so no swap is needed.
  #
  AMBIENT_DARK: "0.10"
  AMBIENT_BRIGHT: "1.20"

  #
  # How far the face is allowed to dim at night, as a fraction of the light's
  # own brightness setting. Never 0 - a clock that reads as "off" in a dark room
  # is worse than one that is slightly too bright.
  #
  MIN_FACE_BRIGHTNESS: "0.10"

  #
  # Hand movement
  #
  # A hand does not snap to its new pixel: the new one fades in while the old
  # one fades out, and a short tail of dimming pixels follows behind - so a
  # second stepping from 10 to 11 reads as movement rather than as two separate
  # states.
  #
  # FADE_MS is how long that step takes. 999 fills the whole second, so the
  # second hand is in permanent motion and sweeps rather than ticks - the fade
  # reaches its target pixel one millisecond before the next second moves it
  # on. Drop it towards 200 for a hand that visibly arrives and sits still.
  #
  # 1000 is a hard ceiling, not a style choice: fadeOf() divides an age that
  # resets every second by this, so anything above it means the fade never
  # reaches 1.0 and the second hand trails its true pixel permanently.
  #
  # TAIL is the length of the trail in pixels. Needs a decimal point: the lambda
  # appends "f" to build a float literal.
  #
  HAND_FADE_MS: "999"
  HAND_TAIL: "3.0"

  #
  # Sun effect
  #
  # Starting point for the Latitude and Longitude text entities, which is where
  # the effect actually reads its coordinates from - these only seed them on the
  # very first boot. Decimal degrees, north and east positive.
  #
  DEFAULT_LATITUDE: "52.520"
  DEFAULT_LONGITUDE: "13.405"

  #
  # Solar elevation, in degrees, at which the light has finished warming up and
  # reads as plain daylight. Below it the colour runs red - orange - yellow, the
  # way the sun does near the horizon. Lower it for a shorter, sharper sunrise.
  #
  # Written with a decimal point on purpose: the lambda appends "f" to build a
  # float literal, and "25f" is not one.
  #
  SUN_WHITE_ELEVATION: "25.0"

  #
  # Fire effect
  #
  # COOLING: how fast a flame cools down each frame. Higher means shorter,
  # darker flames. The original carried a comment recommending 20-100 and then
  # set 15, which is far too little: sparks arrive faster than the heat drains,
  # every cell pins at the top of the scale, and the top of the palette is
  # white. That only became visible once the heat buffer was made to persist
  # between frames - before that it was re-created as uninitialised stack
  # memory every frame and nothing could accumulate.
  #
  # SPARKING: chance out of 255 that a new spark ignites at the base on any
  # given frame. Higher is a more active fire. Sensible range 50-200.
  #
  # MAX_HEAT: caps the palette lookup. The heat-to-colour ramp runs
  # black -> red -> orange -> yellow -> white, and the blue channel - the white
  # - only starts to climb above a heat of ~171. 190 sits just past that, so
  # the hottest cells come out at (255, 255, 56): yellow with a wash on it,
  # rather than the (255, 255, 252) that an uncapped 255 reaches. Raise it
  # towards 255 to let the white tips back in, or below 171 for flat yellow.
  #
  FIRE_COOLING: "55"
  FIRE_SPARKING: "120"
  FIRE_MAX_HEAT: "190"

  #
  # Moon effect
  #
  # Peak brightness, 0-255, before the light's own brightness setting scales it.
  # Moonlight is meant to be dim - the whole ring at 255 is a lamp, not a moon.
  #
  MOON_BRIGHTNESS: "64"

  #
  # Alarm effect
  #
  # Peak colour of the pulse, 0-255 per channel. The last effect that still had
  # its colour hard-coded.
  #
  # The effect scales these by its own 0-255 ramp and divides by 255, so any
  # value in range behaves. It did NOT before: the multiplication ran in int and
  # went straight into Color(uint8_t, uint8_t, uint8_t), so 255 * level
  # overflowed and came out as 256 - level - the ring DIMMED as the ramp climbed
  # and snapped from black to 97% at the bottom of every cycle. A peak of 200
  # degenerated into a four-frame sawtooth, a strobe rather than a pulse.
  #
  ALARM_RED: "255"
  ALARM_GREEN: "0"
  ALARM_BLUE: "0"

#
# https://esphome.io/components/esphome
#
esphome:
  name: "${project_name}"
  friendly_name: "${friendly_name}"
  comment: "${comment}"
  area: "${area}"

  project:
    name: "${author_name}.${project_name}"
    version: "${version}"

  on_boot:
    # priority 600 runs after hardware init, so the ring is already addressable.
    #
    # Twinkle is the "waiting for a valid time" indicator - which since the
    # DS1307 was fitted is no longer the same thing as waiting for the network:
    # the late block below hands over as soon as the RTC has been read, and on
    # a device with a good battery that is the normal path. SNTP and wifi
    # on_connect are what cover a dead or missing RTC.
    #
    # That block used to be a boot trigger at priority 200 testing
    # wifi.connected, which could never be true - every on_boot trigger runs
    # inside setup(), milliseconds apart, long before the radio associates.
    - priority: 600
      then:
        - light.turn_on:
            id: led_ring_id
            effect: Twinkle

    # Negative priority runs after every component is set up, which is what both
    # of these need: the light has to exist before an effect can be selected,
    # and component.update() on a not-yet-set-up entity is not something to rely
    # on.
    # Deliberately NOT -100: a restoring global is a component of its own with
    # setup_priority::HARDWARE, and incrementing at the same priority would be a
    # race against the load() that reads the stored value - the increment could
    # land on the initial 0 and then be overwritten by the restore, so the count
    # would never grow. 700 is safely after every HARDWARE component.
    - priority: 700
      then:
        - lambda: |-
            id(reset_count_id) += 1;

    # Before the ring is lit, and after the i2c bus: the bus is a BUS-priority
    # component (1000) and so is already up, while the DS1307's own setup runs
    # later at DATA (600) - it does not have to have run, because the action
    # only needs the bus pointer and address, and those are set before
    # App.setup() is entered at all.
    #
    # read_time() writes the SYSTEM clock, not just this component's, so
    # everything downstream - the Time effect, show_clock's guard, the
    # astronomy interval - sees a valid time from here on with no network
    # involved. That is the entire point of fitting the RTC.
    - priority: 800
      then:
        - ds1307.read_time:

    - priority: -100
      then:
        # All three are pushed rather than polled: the version string is a
        # compile-time constant, the reset count changes once per boot and the
        # reset reason cannot change while the device is up, so an interval could
        # only republish an unchanged value - publish_state does not deduplicate.
        - component.update: firmware_version_id
        - component.update: reset_count_sensor_id
        - component.update: reset_reason_id

        # The third caller of show_clock, and the only one that does not need
        # a network. If the DS1307 delivered a time at priority 800, it is on
        # the system clock by now and the ring can go straight to the clock
        # face - a battery-backed clock that sat on the boot indicator until
        # an access point turned up would be an RTC bought for nothing.
        #
        # Runs here rather than at 800 because the guard tests the ACTIVE
        # EFFECT: Twinkle is selected at priority 600, so at 800 there is not
        # yet anything for the script to hand over from.
        #
        # No guard needed for the RTC being absent, halted or unreadable -
        # read_time() then leaves the system clock alone, the script's own
        # is_valid() test fails, and Twinkle stays up exactly as before.
        - script.execute: show_clock

  # There is deliberately no on_shutdown block parking the ring.
  #
  # It used to hold `light.turn_off: led_ring_id` at priority 700, which reads
  # as if it darkened the ring before a restart. It never did. Application::
  # reboot() calls on_shutdown() on every component and then arch_restart()
  # straight after, while the only place the strip is actually written is
  # LightState::loop() - and neither light_state nor esp32_rmt_led_strip
  # implements on_shutdown or teardown, so that loop never runs again. The call
  # set next_write_ and nothing ever consumed it.
  #
  # default_transition_length below makes it doubly moot: a turn_off with no
  # explicit length takes the transition branch, so even with a loop it would
  # only have STARTED a 1s fade that the restart cuts off mid-way.
  #
  # WS2811s latch their last frame, so the ring keeps showing whatever it showed
  # right through the restart either way. Better an honest gap than a line that
  # looks like it handles this.

#
# https://esphome.io/components/esp32
#
esp32:
  board: esp32-c3-devkitm-1

  # The variant default, and back at it after a spell at 80MHZ.
  #
  # 80 was the second lever against the die temperature, after the WiFi power
  # save mode below, and it looked free: nothing here is compute-bound. The
  # heaviest load is the Fire effect at 30 ms over 30 heat cells, and Time at
  # 50 ms over 60 pixels.
  #
  # What it was not free of is INTERRUPT latency. The LED ring is driven from
  # RMT with a 96-symbol buffer - the C3 maximum, two 48-symbol blocks - which
  # at WS2811 timing is about 133 us of data, so the refill ISR has to run
  # every ~67 us for the whole 2 ms of a frame. Miss it once and every LED
  # after that point takes shifted bits: a handful of pixels in the wrong
  # colour for one frame. Halving the clock halves the margin on that, on a
  # chip that is also servicing WiFi, the api, mqtt and a web server.
  #
  # If the die runs hotter than wanted, take it out of power_save_mode or the
  # brightness, not out of this.
  cpu_frequency: 160MHZ

  framework:
    # esp-idf, not arduino: the only thing that tied this device to arduino was
    # the neopixelbus light platform, which wraps an Arduino library. The light
    # below now uses esp32_rmt_led_strip, which drives the same RMT peripheral
    # neopixelbus was already configured to use - so this costs nothing on the
    # wire and drops the whole Arduino layer from flash and RAM.
    #
    # Consequence: no Arduino-only APIs (String, WiFi.*, byte, the min/max
    # macros) in any lambda here. The effect lambdas use std::min / std::max /
    # std::abs for exactly that reason.
    type: esp-idf

#
# Twelve things persist here - the three hand colours, the two coordinates, the
# alarm time, its duration and its arming switch, both selects, the seconds
# switch and the reset count - and every one of them lands in the same flash
# sector. The MQTT switch is not among them: it is ALWAYS_OFF, which neither
# reads nor writes a preference.
#
# The default buffers writes for 60s; 5min buffers a burst of slider-dragging in
# Home Assistant into a single erase cycle instead of several.
#
# The cost is the same either way: a change made less than the interval before a
# power cut is lost. None of these values is worth a flash sector.
#
# https://esphome.io/components/esphome#preferences
#
preferences:
  flash_write_interval: 5min

#
# https://esphome.io/components/wifi
#
wifi:
  id: wifi_id
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: .local

  # False, not the True this had. fast_connect skips the scan and associates
  # with the first AP that answers for the SSID, which is what you want for a
  # hidden network and a liability on any other: with more than one access point
  # on the same SSID the device sticks to whoever replies first rather than to
  # the strongest. At the -63 to -65 dBm this node sees, picking the better BSSID
  # is worth the second or two the scan costs once per boot.
  #
  # Put it back to True if this SSID is hidden - fast_connect is the only way to
  # associate with one.
  fast_connect: False

  # LIGHT, not the NONE this started with: NONE keeps the radio powered up
  # permanently, which was the single largest heat source on this board - the
  # die sat at 67 C with the LED ring on its own supply, so none of that was
  # coming from the strip. LIGHT maps to WIFI_PS_MIN_MODEM, which sleeps between
  # DTIM beacons and wakes for every one of them.
  #
  # Measured: 67 C -> 38-41 C. That was together with a cpu_frequency of 80MHZ,
  # which has since gone back to 160MHZ for the reason given up there, so the
  # figure understates what this line alone is worth today.
  #
  # The trade is one-sided in this device's favour. Only INBOUND traffic is
  # delayed - the access point buffers it until the next beacon, typically 100
  # to 300 ms. Outbound is not affected at all, so the sensor publishes that
  # make up almost all of this node's traffic go out immediately, and the clock
  # itself never touches the network between SNTP syncs.
  #
  # HIGH would sleep through a longer listen interval. Not worth it: the delay
  # reaches seconds and the link gets fragile at this RSSI (-63 to -65 dBm).
  #
  # If OTA updates start failing, this is the first line to put back to NONE.
  power_save_mode: LIGHT

  enable_on_boot: True

  # Leaves the boot indicator and shows the clock - see the show_clock script for
  # the two conditions that have to hold. Associating is only half of it: an
  # access point without a route to the internet gives no SNTP, and switching to
  # the clock face then would blank the ring, so the script waits for a valid
  # time as well and time: on_time_sync drives the other half.
  #
  # There is deliberately no on_disconnect counterpart. The clock runs off the
  # system clock, not off the network, so losing WiFi is no reason to stop
  # showing the time.
  on_connect:
    - script.execute: show_clock

  # Reduced from the ~20 dBm default. Barely moves the power budget - this node
  # transmits well under 0.1% of the time - but it does no harm either. Do not
  # go lower: at this RSSI a weaker uplink means retransmits, and those cost
  # more airtime than the lower power saves.
  output_power: 12dB
  ap:
    ssid: "${project_name}"
    password: !secret wifi_ap_password

#
# https://esphome.io/components/captive_portal
#
captive_portal:

#
# Only the classic push OTA from the dashboard: this node has no display to
# show progress on, so the http_request pull path is not worth the flash.
#
ota:
  #
  # https://esphome.io/components/ota/esphome
  #
  - platform: esphome
    password: !secret ota_password
    # The ring is not idle while an update runs: the effect lambdas and the RMT
    # transfers compete with it for CPU and for the WiFi stack. Parking the
    # light for the duration is free insurance, and matters more now that the
    # radio sleeps between beacons.
    on_begin:
      then:
        - light.turn_off: led_ring_id
    # A failed update does not reboot, so put the clock back.
    on_error:
      then:
        - light.turn_on:
            id: led_ring_id
            effect: Time
    on_abort:
      then:
        - light.turn_on:
            id: led_ring_id
            effect: Time

#
# https://esphome.io/components/api
#
api:
  # Enable transport encryption of the API layer.
  encryption:
    # The pre-shared key for the encryption.
    key: !secret api_encryption_key
  # 0s disables the automatic reboot when Home Assistant is unreachable: this
  # node keeps running the clock and publishing via MQTT even without an API
  # client, which matters because it is the only clock in the room.
  reboot_timeout: 0s

#
# https://esphome.io/components/mqtt
#
mqtt:
  id: mqtt_client_id
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  reboot_timeout: 0s

  # Off at boot, and the MQTT switch's restore_mode has to stay in step with this
  # line. The coupling is not cosmetic: TemplateSwitch::setup() acts on the
  # restored state rather than just publishing it - it calls turn_on() or
  # turn_off() outright, firing the actions - so a mismatch here silently
  # overrides this value a moment after boot, and the config validates happily
  # while doing it. Change one, change the other.
  enable_on_boot: False

  # No autodiscovery: the entities are declared in Home Assistant by hand, so
  # discovery would only publish retained config topics nobody consumes.
  discovery: False
  keepalive: 60s

#
# https://esphome.io/components/web_server
#
web_server:
  port: 80
  version: 3
  # assets served from flash instead of a CDN, so the page also works while the
  # WiFi has no route to the internet - e.g. from the fallback access point
  local: True
  # Without this anyone on the LAN can drive the ring - and reach the Factory
  # Reset button, which clears the WiFi credentials. The credentials were
  # already sitting unused in secrets.yaml.
  auth:
    type: digest
    username: !secret web_username
    password: !secret web_password

#
# https://esphome.io/components/time
#
# SNTP only, deliberately.
#
# A "time: platform: homeassistant" fallback was tried here and removed again:
# the API carries the time as uint32 epoch SECONDS, so every sync discarded the
# sub-second alignment SNTP had established and stepped the system clock by up
# to a second - backwards, most of the time, because truncation always rounds
# down. It re-synced every 15 minutes, and on a device whose whole job is
# showing seconds that was a visible jump four times an hour.
#
# The fallback it bought was real: time without a route to the internet. But a
# clock that is occasionally wrong by a second in a way you can watch is worse
# than a clock that needs NTP. If this comes back, it belongs with the second
# hand switched off.
#
time:

  #
  # https://esphome.io/components/time/ds1307
  #
  # Read once at boot (see on_boot priority 800) and never polled again.
  # Repeated re-reads would only pull the accurate SNTP time back towards
  # the drift of a DS1307, which is the wrong direction.
  #
  # A NEW OR REPLACED MODULE IS DEAD ON ITS FIRST BOOT, and that is normal.
  # A DS1307 leaves the factory with CH - the clock-halt bit in register 0
  # - set, oscillator stopped, registers reading 2000-01-01 00:00:00.
  # ESPHome refuses to sync from that ("RTC halted, not syncing to system
  # clock"), so the first boot behaves exactly like a device with no RTC at
  # all: Twinkle stays up until SNTP lands. The write-back on that first
  # sync is what clears CH and starts the oscillator - from the second boot
  # onwards the clock face is up before the radio has associated.
  #
  # So a fitted-but-never-set module and a broken one look identical for one
  # boot. The i2c scan below tells them apart, and so does the CH flag in the
  # ds1307 DEBUG line.
  #
  - platform: ds1307
    id: ds1307_time
    address: 0x68
    update_interval: never

  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org


    #
    # Every successful network sync is written back to the RTC, so the
    # battery-backed time is never more than one sync interval stale. This
    # is what makes the clock come up right after a power cut without a
    # network.
    #
    # The second half of the boot handover, with wifi: on_connect being the
    # first. Associating with an access point that has no route to the internet
    # satisfies on_connect but never produces a time, and the Time effect blanks
    # the ring when the clock is invalid - so the device would sit there dark
    # with one ERROR line and nothing to look at. Twinkle stays up until a sync
    # actually lands.
    #
    # Fires on every sync, not only the first; the script's own guard makes the
    # repeats harmless.
    on_time_sync:
      then:
        - ds1307.write_time:
            id: ds1307_time
        - script.execute: show_clock

#
# https://esphome.io/components/logger
#
logger:
  # ERROR only: the ring is driven from a lambda that runs many times a second,
  # and logging at that rate over the api costs more than the messages are worth
  #
  #
  # To debug the RTC, raise this to DEBUG and set i2c scan: True together: the
  # bus scan prints at CONFIG and the DS1307's own "Read hh:mm:ss / CH:.." line
  # at DEBUG, so neither is visible here.
  level: ERROR

#
# The ESPHome `debug` component is deliberately NOT used here, and neither is
# `internal_temperature`. On this ESP32-C3 under ESP-IDF 5.5.5 either one on its
# own stops the SoftAP from beaconing: the fallback access point disappears
# entirely while the rest of the firmware keeps running normally. Found by
# bisecting a minimal config on the sibling odb2-sniffer board - adding `debug:`
# alone reproduces it, removing it restores the AP - and the on-chip temperature
# sensor shares hardware with the RF subsystem, which is the likely mechanism
# for both.
#
# That matters more here than anywhere else in the fleet, because `ap:` is
# configured. WiFiComponent::loop() guards its reboot-on-no-connection with
# `!this->has_ap()`, and has_ap_ is set at config time, not when the AP comes
# up - so with an `ap:` block present the reboot timeout never fires. Lose the
# credentials with a mute SoftAP and there is no fallback AP AND no reboot to
# retry with: the way back in is a serial reflash.
#
# The reset reason it provided is read from esp_reset_reason() directly further
# down instead - same value, no component in the RF path.
#
# If a die temperature is ever wanted back, take it from a source that does not
# touch the radio. The 67 C -> 38-41 C figure quoted on power_save_mode above
# was measured with this sensor before it was removed.
#

#
# https://esphome.io/components/globals
#
globals:

  #
  # Latch so the "invalid time from sntp" error is logged once per boot instead
  # of on every frame. The Time effect runs several times a second; without this
  # a device that never reaches an NTP server would flood the log and the api.
  #
  - id: global_debug
    type: int
    restore_value: no
    initial_value: '0'

  #
  # Mirrors the Enable seconds switch. The effect lambda needs the value at
  # frame rate, and reading a global is cheaper than going through the switch
  # component every time.
  #
  - id: global_enable_seconds
    type: int
    restore_value: no
    initial_value: '0'

  #
  # Survives restarts, so a rising count is proof the device rebooted even if
  # nobody was watching the log. Counts every restart alike - OTA, the Restart
  # button, a power cut and a watchdog are indistinguishable here, which is why
  # Reset Reason sits next to it. A factory reset clears it back to 0.
  #
  - id: reset_count_id
    type: int
    restore_value: yes
    initial_value: '0'

  #
  # Ambient dim factor, 0..1, recomputed whenever the Brightness sensor
  # publishes. Every effect that should follow the room light multiplies its
  # finished frame by this - the mapping from volts to a factor lives once, on
  # the sensor, instead of once per effect.
  #
  - id: global_ambient_dim
    type: float
    restore_value: no
    initial_value: '1.0f'

  #
  # Sky, filled by the astronomy interval below. NAN means "not computed yet",
  # which is also what the effects see before the clock has a valid time.
  #
  # These exist so the position maths runs ONCE per tick instead of once per
  # effect frame: the Sun and Moon effects both need the sun, and the diagnostic
  # sensors need both. Three copies of the same trigonometry would be three
  # chances to fix a bug in only two of them.
  #
  - id: global_sun_elevation
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: global_sun_max_elevation
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: global_moon_altitude
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: global_moon_illuminated
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: global_moon_waxing
    type: bool
    restore_value: no
    initial_value: 'true'

  #
  # Whether the ring was already on when the alarm fired. The alarm has to
  # switch it on to be of any use, so without remembering this it could not tell
  # "it was off, put it back" from "it was showing the clock, leave it showing
  # the clock" when the timer runs out.
  #
  - id: global_alarm_was_on
    type: bool
    restore_value: no
    initial_value: 'false'

#
# https://esphome.io/components/i2c
#
# SUPPLY: the RTC module runs on 3V3, not on 5V. This is not the obvious
# choice for a DS1307 - the part is specified for 4.5-5.5V - and on most
# boards carrying one it would not work at all, so the reasoning is worth
# having in writing. Schematic: docs/TinyRTC-Diagram.jpg.
#
# Two things decide it, and both are specific to THIS board.
#
# 1. The access threshold. A DS1307 stops answering on the bus whenever VCC
#    falls below 1.25x the voltage on its VBAT pin. Wire a 3.0V cell
#    straight to VBAT, as most modules do, and that threshold is 3.75V - the
#    clock keeps perfect time on 3V3 and simply never replies, which is the
#    single most common "my DS1307 is broken" report there is.
#
#    This board does not wire it straight. R6 (470k) sits in series between
#    the cell and VBAT, with R4 (1.5M) from VBAT to ground: a divider that
#    hands the pin 1.5M/1.97M = 0.76 of the cell. A 3.0V CR2032 therefore
#    presents 2.28V, the threshold lands at 2.86V, and 3V3 clears it.
#
#    Consequence: do NOT "fix" R6 by shorting it. That restores the full
#    3.0V on VBAT, puts the threshold back at 3.75V, and kills the bus.
#
# 2. The charging circuit. R5 (200R) and D1 (1N4148) run from VCC to the
#    cell - this board is built for a rechargeable LIR2032. On 5V that pumps
#    ~6.5mA into whatever is in the holder, and into a non-rechargeable
#    CR2032 that means heat, outgassing and eventually a vented cell. On 3V3
#    the diode never forward-biases at all (3.3 - 0.7 = 2.6V, under any cell
#    worth having), so the path is simply inert.
#
# So: 3V3 and a CR2032. A LIR2032 is the wrong cell here - it would never be
# recharged and would fall out of the DS1307's 2.0V VBAT minimum within
# months. The CR2032 is not generous either: at 500nA through the divider's
# 358k source impedance the pin sees ~2.11V against that 2.0V minimum, so
# the module will lose the time while the cell still measures near 3V.
# Losing it is survivable - SNTP re-syncs and writes back - but it is why
# the boot handover does not assume the RTC answered.
#
# Powering the module from 3V3 also keeps the bus pull-ups (R2/R3, 3k3 to
# VCC) at 3V3. On 5V they would idle the bus at 5V, which is past the
# absolute maximum of a C3 GPIO and back-feeds the 3V3 rail through the pin
# clamps.
#
# The DS1307 is the only device on this bus and it is a 100kHz part - it
# does not do fast mode, so there is nothing to gain by raising this.
#
# Not quite the only device, in fact: the module also carries an AT24C32
# EEPROM at 0x50-0x57 (A0-A2 jumpers), unused here. The schematic also shows
# a DS18B20 - 1-Wire on its own header pin, not on this bus - but that
# footprint is EMPTY on this build, so there is no temperature sensor to
# find and nothing to read from that pin.
#
# scan is off because the bus holds nothing worth discovering and the scan
# costs a moment on every boot. Turn it on together with logger level DEBUG
# when the question is whether the RTC answers: the address list is the
# fastest way to tell a dead module from a wiring fault, and the EEPROM
# makes it conclusive - it is a 2.5-5.5V part on the same two wires, so
# 0x50 without 0x68 would isolate the DS1307 from any wiring doubt.
#
# Measured on this build, 2026-08-21: both 0x50 and 0x68 answer on 3V3, so
# the supply reasoning above is confirmed on hardware and not just on paper.
#
i2c:
  id: i2c_id
  sda: ${PIN_I2C_SDA}
  scl: ${PIN_I2C_SCL}
  frequency: 100kHz

  scan: False

#
# The one place solar and lunar position are computed. Runs on its own clock so
# the effect lambdas stay cheap: they read globals and draw.
#
# 10s is far more often than anything here changes - the sun moves 0.004 deg/s,
# the moon half a degree an hour - but it keeps the ring responsive at sunrise
# and moonrise without putting double-precision trigonometry on a render path.
#
# https://esphome.io/components/interval
#
interval:
  - interval: 10s
    then:
      - lambda: |-
          auto time = id(sntp_time).now();

          if (!time.is_valid()) {
            id(global_sun_elevation) = NAN;
            id(global_sun_max_elevation) = NAN;
            id(global_moon_altitude) = NAN;
            id(global_moon_illuminated) = NAN;
            return;
          }

          // Coordinates live in the text entities; parsed here, once, rather
          // than in each effect. Anything unparseable or out of range falls
          // back to the compiled default.
          auto parseCoord = [](const std::string &str, float fallback, float limit) -> float {
            if (str.empty()) {
              return fallback;
            }
            char *end = nullptr;
            const float v = strtof(str.c_str(), &end);
            if (end == str.c_str() || !std::isfinite(v) || v < -limit || v > limit) {
              return fallback;
            }
            return v;
          };

          const double obsLat = parseCoord(id(latitude_text_id).state, ${DEFAULT_LATITUDE}f, 90.0f);
          const double obsLon = parseCoord(id(longitude_text_id).state, ${DEFAULT_LONGITUDE}f, 180.0f);

          constexpr double DEG = 0.017453292519943295;
          constexpr double RAD = 57.29577951308232;

          auto sind = [DEG](double a) { return std::sin(a * DEG); };
          auto cosd = [DEG](double a) { return std::cos(a * DEG); };
          auto rev = [](double a) {
            const double r = std::fmod(a, 360.0);
            return (r < 0.0) ? r + 360.0 : r;
          };

          // Days since 2000 Jan 0.0 TDT, the epoch these orbital elements are
          // referenced to (Schlyter). Cross-checked against the Astronomical
          // Almanac's low-precision solar formula: they agree to 0.003 degrees
          // over a full year, so one set of elements serves both bodies.
          const double d = (double) time.timestamp / 86400.0 - 10956.0;

          const double obliq = 23.4393 - 3.563e-7 * d;
          const double utHours = std::fmod((double) time.timestamp / 3600.0, 24.0);

          // --- Sun
          const double sunW = 282.9404 + 4.70935e-5 * d;
          const double sunE = 0.016709 - 1.151e-9 * d;
          const double sunM = rev(356.0470 + 0.9856002585 * d);

          const double sunEcc = sunM + sunE * RAD * sind(sunM) * (1.0 + sunE * cosd(sunM));
          const double sunLon = rev(std::atan2(std::sqrt(1.0 - sunE * sunE) * sind(sunEcc),
                                               cosd(sunEcc) - sunE) * RAD + sunW);
          const double sunMeanLon = rev(sunM + sunW);

          // Local sidereal time, needed for both bodies' hour angles.
          const double lst = rev(sunMeanLon + 180.0 + utHours * 15.0 + obsLon);

          const double sunDec = std::asin(sind(obliq) * sind(sunLon)) * RAD;
          const double sunRa = std::atan2(cosd(obliq) * sind(sunLon), cosd(sunLon)) * RAD;
          const double sunHa = rev(lst - sunRa);

          id(global_sun_elevation) = (float) (std::asin(sind(obsLat) * sind(sunDec) +
                                                        cosd(obsLat) * cosd(sunDec) * cosd(sunHa)) * RAD);

          // At solar noon the hour angle is 0 and the elevation reduces to
          // this. Normalising the Sun effect's arc against it means the ring
          // closes at local noon on any day of the year, not only in midsummer.
          id(global_sun_max_elevation) = (float) (90.0 - std::fabs(obsLat - sunDec));

          // --- Moon
          const double moonN = 125.1228 - 0.0529538083 * d;
          const double moonI = 5.1454;
          const double moonW = 318.0634 + 0.1643573223 * d;
          const double moonA = 60.2666;
          const double moonEcc = 0.054900;
          const double moonM = rev(115.3654 + 13.0649929509 * d);

          double E = moonM + moonEcc * RAD * sind(moonM) * (1.0 + moonEcc * cosd(moonM));
          E = E - (E - moonEcc * RAD * sind(E) - moonM) / (1.0 - moonEcc * cosd(E));

          const double mx = moonA * (cosd(E) - moonEcc);
          const double my = moonA * std::sqrt(1.0 - moonEcc * moonEcc) * sind(E);
          const double moonR = std::sqrt(mx * mx + my * my);
          const double vw = std::atan2(my, mx) * RAD + moonW;

          const double xeclip = moonR * (cosd(moonN) * cosd(vw) - sind(moonN) * sind(vw) * cosd(moonI));
          const double yeclip = moonR * (sind(moonN) * cosd(vw) + cosd(moonN) * sind(vw) * cosd(moonI));
          const double zeclip = moonR * sind(vw) * sind(moonI);

          double moonLon = std::atan2(yeclip, xeclip) * RAD;
          double moonLat = std::atan2(zeclip, std::sqrt(xeclip * xeclip + yeclip * yeclip)) * RAD;

          // The moon's orbit is badly behaved. The evection term alone is 1.27
          // degrees, which is several minutes of moonrise, so these are not
          // decoration.
          const double Lm = rev(moonM + moonW + moonN);
          const double Dm = rev(Lm - sunMeanLon);
          const double Fm = rev(Lm - moonN);

          moonLon += -1.274 * sind(moonM - 2.0 * Dm)
                   +  0.658 * sind(2.0 * Dm)
                   -  0.186 * sind(sunM)
                   -  0.059 * sind(2.0 * moonM - 2.0 * Dm)
                   -  0.057 * sind(moonM - 2.0 * Dm + sunM)
                   +  0.053 * sind(moonM + 2.0 * Dm)
                   +  0.046 * sind(2.0 * Dm - sunM)
                   +  0.041 * sind(moonM - sunM)
                   -  0.035 * sind(Dm)
                   -  0.031 * sind(moonM + sunM)
                   -  0.015 * sind(2.0 * Fm - 2.0 * Dm)
                   +  0.011 * sind(moonM - 4.0 * Dm);

          moonLat += -0.173 * sind(Fm - 2.0 * Dm)
                   -  0.055 * sind(moonM - Fm - 2.0 * Dm)
                   -  0.046 * sind(moonM + Fm - 2.0 * Dm)
                   +  0.033 * sind(Fm + 2.0 * Dm)
                   +  0.017 * sind(2.0 * moonM + Fm);

          moonLon = rev(moonLon);

          // Phase from the true elongation between moon and sun, not from a
          // mean synodic month: the moon runs up to six degrees ahead of and
          // behind its mean motion, worth half a day at the extremes.
          const double elongation = rev(moonLon - sunLon);
          id(global_moon_illuminated) = (float) ((1.0 - cosd(elongation)) / 2.0);
          id(global_moon_waxing) = elongation < 180.0;

          const double xg = cosd(moonLon) * cosd(moonLat);
          const double yg = sind(moonLon) * cosd(moonLat);
          const double zg = sind(moonLat);

          const double ye = yg * cosd(obliq) - zg * sind(obliq);
          const double ze = yg * sind(obliq) + zg * cosd(obliq);

          const double moonRa = std::atan2(ye, xg) * RAD;
          const double moonDec = std::atan2(ze, std::sqrt(xg * xg + ye * ye)) * RAD;
          const double moonHa = rev(lst - moonRa);

          double moonAlt = std::asin(sind(obsLat) * sind(moonDec) +
                                     cosd(obsLat) * cosd(moonDec) * cosd(moonHa)) * RAD;

          // The moon is near enough that where you stand on the Earth moves it
          // by about a degree - several minutes either side of moonrise.
          moonAlt -= std::asin(1.0 / moonR) * RAD * cosd(moonAlt);

          id(global_moon_altitude) = (float) moonAlt;

  #
  # The four sky sensors publish on their own, slower clock.
  #
  # They used to be pushed from the 10s block above, which meant 4 x 6 = 24
  # publishes a minute over the api and, when it is on, mqtt: about 34,500 a
  # day. publish_state does not deduplicate - the same reason Firmware Version
  # stopped being polled - and most of those carried an unchanged value. At one
  # decimal the moon's altitude changes roughly every twelve minutes and its
  # illumination essentially never.
  #
  # The RING still follows the sky at 10s: the effects read the globals, not
  # these entities. This only sets how often Home Assistant hears about it.
  #
  - interval: 60s
    then:
      - component.update: sun_elevation_id
      - component.update: moon_altitude_id
      - component.update: moon_illumination_id
      - component.update: moon_phase_id


#
# https://esphome.io/components/text_sensor
#
text_sensor:

  #
  # Reset Reason
  #
  # Cause of the last restart, straight from esp_reset_reason(). Read it
  # together with Reset Count and Device Uptime: the reason alone cannot tell
  # you that a restart happened while nobody was looking, and a rising count at
  # a low uptime is the signature of a device rebooting in a loop.
  #
  # Read directly rather than through the ESPHome `debug` component, which kills
  # the SoftAP on this chip - see the note where that component used to be.
  #
  # update_interval: never, like Firmware Version: the reason cannot change
  # while the device is up, so polling it could only republish an identical
  # string forever. Pushed once from the late on_boot block.
  #
  - platform: template
    id: reset_reason_id
    name: Reset Reason
    icon: mdi:restart-alert
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      switch (esp_reset_reason()) {
        case ESP_RST_POWERON:   return {"Power on"};
        case ESP_RST_EXT:       return {"External reset"};
        case ESP_RST_SW:        return {"Software reset"};
        case ESP_RST_PANIC:     return {"Panic / exception"};
        case ESP_RST_INT_WDT:   return {"Interrupt watchdog"};
        case ESP_RST_TASK_WDT:  return {"Task watchdog"};
        case ESP_RST_WDT:       return {"Other watchdog"};
        case ESP_RST_DEEPSLEEP: return {"Deep sleep wake"};
        case ESP_RST_BROWNOUT:  return {"Brownout"};
        case ESP_RST_SDIO:      return {"SDIO reset"};
        case ESP_RST_USB:       return {"USB peripheral"};
        case ESP_RST_JTAG:      return {"JTAG"};
        default:                return {"Unknown"};
      }

  #
  # ESPHome Version
  # https://esphome.io/components/text_sensor/version
  #
  - platform: version
    name: ESPHome Version
    icon: mdi:new-box
    entity_category: diagnostic

  #
  # Firmware Version
  #
  - platform: template
    id: firmware_version_id
    name: Firmware Version
    icon: mdi:new-box
    entity_category: diagnostic
    # A compile-time constant. Polling it re-sent the same string to the api and
    # mqtt every 60s for the lifetime of the device; publish_state does not
    # deduplicate, so nothing upstream was filtering that out. Published once
    # from the late on_boot block instead.
    update_interval: never
    lambda: |-
      return {"$version"};

  #
  # Device Uptime
  #
  - platform: template
    name: Device Uptime
    icon: mdi:clock-start
    entity_category: diagnostic
    device_class: ""
    lambda: |-
          // The uptime sensor only publishes from update(), so its state is NaN
          // until the first poll. Test that BEFORE the cast: converting a NaN
          // float to int is undefined behaviour, and the guard this replaces
          // ("days > 3650") assumed the cast would yield a huge positive value.
          // It generally does not, so the fallback below never actually fired
          // and the first minute showed whatever the conversion happened to
          // produce.
          const float uptime = id(uptime_seconds_id).state;
          if (std::isnan(uptime)) {
            return {"Starting up"};
          }

          int seconds = (int) uptime;
          int days = seconds / (24 * 3600);

          seconds = seconds % (24 * 3600);

          int hours = seconds / 3600;
          seconds = seconds % 3600;

          int minutes = seconds /  60;
          seconds = seconds % 60;

          char buf[32];
          if (days) {
            snprintf(buf, sizeof(buf), "%dd %dh %dm %ds", days, hours, minutes, seconds);
          } else if (hours) {
            snprintf(buf, sizeof(buf), "%dh %dm %ds", hours, minutes, seconds);
          } else if (minutes) {
            snprintf(buf, sizeof(buf), "%dm %ds", minutes, seconds);
          } else {
            snprintf(buf, sizeof(buf), "%ds", seconds);
          }
          return {buf};

  #
  # Moon Phase
  #
  # The eight conventional names, from the illuminated fraction and the waxing
  # flag. Boundaries are the usual ones: under 2% reads as new, over 98% as
  # full, and the quarters sit within 2% of half.
  #
  - platform: template
    id: moon_phase_id
    name: Moon Phase
    icon: mdi:moon-waning-crescent
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      const float f = id(global_moon_illuminated);
      if (std::isnan(f)) {
        return {"Unknown"};
      }
      if (f < 0.02f) {
        return {"New moon"};
      }
      if (f > 0.98f) {
        return {"Full moon"};
      }
      const bool waxing = id(global_moon_waxing);
      if (f > 0.48f && f < 0.52f) {
        return {waxing ? "First quarter" : "Last quarter"};
      }
      if (f < 0.5f) {
        return {waxing ? "Waxing crescent" : "Waning crescent"};
      }
      return {waxing ? "Waxing gibbous" : "Waning gibbous"};

  #
  # WiFi Information
  # https://esphome.io/components/text_sensor/wifi_info
  #
  - platform: wifi_info
    ssid:
      name: SSID
      icon: mdi:wifi-star
    ip_address:
      id: ip_address_id
      name: IP Address
      icon: mdi:ip-network-outline
    dns_address:
      name: DNS Address
      icon: mdi:dns-outline

#
# https://esphome.io/components/binary_sensor
#
binary_sensor:

  #
  # Connection Status
  # https://esphome.io/components/binary_sensor/status
  #
  - platform: status
    name: Connection Status
    icon: mdi:connection
    entity_category: diagnostic

#
# https://esphome.io/components/button
#
button:

  #
  # https://esphome.io/components/button/restart
  #
  - platform: restart
    id: restart_id
    name: Restart
    icon: mdi:reload

  #
  # Clears every stored preference - the persisted hand colours included - and
  # drops the WiFi credentials, so the device comes back on the fallback AP.
  # https://esphome.io/components/button/factory_reset
  #
  - platform: factory_reset
    id: factoryreset_id
    name: Factory Reset
    icon: mdi:restart

  #
  # Reboots with all user components disabled, leaving only WiFi and OTA. The
  # way back in when a bad effect lambda takes the device down before it can be
  # flashed.
  # https://esphome.io/components/button/safe_mode
  #
  - platform: safe_mode
    id: safemode_id
    name: Restart (Safe Mode)
    icon: mdi:reload

#
# https://esphome.io/components/sensor
#
sensor:

  #
  # https://esphome.io/components/sensor/uptime
  #
  - platform: uptime
    id: uptime_seconds_id
    name: Uptime
    icon: mdi:timer-outline
    type: seconds
    internal: True
    entity_category: diagnostic
    device_class: ""

  #
  # Coordinates from Home Assistant
  #
  # Home Assistant keeps its own installation's location on zone.home. Importing
  # it means the Sun effect is right without anyone typing coordinates - and the
  # Latitude / Longitude text entities stay the single value the effect reads,
  # so nothing downstream has to know where the numbers came from.
  #
  # Requires the native API and this device added through the ESPHome
  # integration; over MQTT alone these never publish. That is the intended
  # fallback: with no Home Assistant the text entities simply keep their stored
  # value, and with no stored value the effect falls back to DEFAULT_LATITUDE
  # and DEFAULT_LONGITUDE.
  #
  # Consequence worth knowing: Home Assistant wins. Editing the text entities by
  # hand works, but the next time HA connects or zone.home changes it overwrites
  # them. Delete these two sensors if the device should keep its own coordinates.
  #
  # internal, because publishing them back to Home Assistant would only echo
  # what it already told us.
  #
  # https://esphome.io/components/sensor/homeassistant
  #
  - platform: homeassistant
    id: ha_latitude_id
    entity_id: zone.home
    attribute: latitude
    internal: true
    on_value:
      # The string comparison is not cosmetic: the text entities have
      # restore_value, so every write hits flash. zone.home republishes on each
      # reconnect with an unchanged value, and rewriting it every time would
      # wear the sector for nothing.
      - lambda: |-
          if (std::isnan(x)) {
            return;
          }
          char buf[16];
          snprintf(buf, sizeof(buf), "%.5f", x);
          if (id(latitude_text_id).state == buf) {
            return;
          }
          auto call = id(latitude_text_id).make_call();
          call.set_value(buf);
          call.perform();

  - platform: homeassistant
    id: ha_longitude_id
    entity_id: zone.home
    attribute: longitude
    internal: true
    on_value:
      - lambda: |-
          if (std::isnan(x)) {
            return;
          }
          char buf[16];
          snprintf(buf, sizeof(buf), "%.5f", x);
          if (id(longitude_text_id).state == buf) {
            return;
          }
          auto call = id(longitude_text_id).make_call();
          call.set_value(buf);
          call.perform();

  #
  # Sky, straight from the astronomy interval. These cost nothing to expose -
  # the values are computed anyway - and they turn the clock into a usable
  # source for automations without needing an integration for it.
  #
  # update_interval: never - pushed by the interval that computes them, so they
  # cannot report a value the ring is not showing.
  #
  - platform: template
    id: sun_elevation_id
    name: Sun Elevation
    icon: mdi:weather-sunny
    unit_of_measurement: "°"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      return id(global_sun_elevation);

  - platform: template
    id: moon_altitude_id
    name: Moon Altitude
    icon: mdi:weather-night
    unit_of_measurement: "°"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      return id(global_moon_altitude);

  - platform: template
    id: moon_illumination_id
    name: Moon Illumination
    icon: mdi:moon-waning-crescent
    unit_of_measurement: "%"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      if (std::isnan(id(global_moon_illuminated))) {
        return NAN;
      }
      return id(global_moon_illuminated) * 100.0f;

  #
  # Internal Temperature is deliberately removed. The SoC die sensor kills the
  # SoftAP on this ESP32-C3 the same way the debug component does - see the note
  # where that component used to be. It was worth having while the thermal work
  # was going on (it is where the 67 C -> 38-41 C figure comes from), and it is
  # not worth a silently dead fallback access point afterwards.
  #
  # To measure again: put `- platform: internal_temperature` back temporarily,
  # take the readings over USB, then remove it before the clock goes on a wall.
  #

  #
  # https://esphome.io/components/sensor/wifi_signal
  #
  - platform: wifi_signal
    id: wifi_signal_db
    name: WiFi Signal (dBm)
    icon: mdi:wifi
    entity_category: diagnostic
    device_class: ""
    unit_of_measurement: "dBm"
    update_interval: 60s

  #
  # The same reading as a percentage, for people who do not read dBm. Derived
  # with copy rather than a second wifi_signal so both entities always agree.
  # https://esphome.io/components/sensor/copy
  #
  - platform: copy
    id: wifi_signal_percent
    name: WiFi Signal (%)
    icon: mdi:wifi
    source_id: wifi_signal_db
    unit_of_measurement: "%"
    entity_category: diagnostic
    device_class: ""
    filters:
      # std:: qualified: min/max are Arduino macros, and this device builds
      # against esp-idf where they do not exist
      - lambda: return std::min(std::max(2 * (x + 100.0), 0.0), 100.0);

  #
  # Ambient brightness from an LDR divider. Read by the Time effect, which dims
  # the whole face between AMBIENT_DARK and AMBIENT_BRIGHT.
  #
  # Published as plain volts. It used to multiply by 100 and call the result
  # "%", which it never was - that is volts times a hundred, and it made the
  # calibration values impossible to check against a multimeter.
  #
  # attenuation is spelled out because the schema default is 0db, which caps
  # the input at ~1.1 V. An LDR divider on 3.3 V spends most of its range above
  # that, so every reading from a half-lit room upwards clipped to the same
  # flat maximum - exactly the end of the scale the dimming needs to resolve.
  # 12db opens the range to ~0 - 3.1 V.
  #
  # https://esphome.io/components/sensor/adc
  #
  - platform: adc
    id: brightness_sensor
    name: Brightness
    icon: mdi:brightness-6
    pin: ${PIN_ADC}
    attenuation: 12db
    entity_category: diagnostic
    accuracy_decimals: 3
    # Sampled once a second and averaged over 8 hardware reads, but only
    # published every fifth - so the traffic is the same 0.2 Hz as before while
    # the value behind it is a 20-second moving average.
    #
    # This is what makes dusk look like dusk. The Time effect reads .state, so
    # the face only changes brightness when this publishes: a single raw sample
    # every 5s made it step visibly, both from ADC noise and from a cloud
    # passing. Averaging shrinks each step to roughly a fifth. The cost is
    # latency - switching a lamp on takes ~20s to fully register, which for a
    # clock is a feature.
    update_interval: 1s
    samples: 8
    filters:
      - sliding_window_moving_average:
          window_size: 20
          send_every: 5
    # The volts-to-dim-factor mapping lives here, once, instead of once per
    # effect. Swapping AMBIENT_DARK and AMBIENT_BRIGHT inverts it, which is the
    # documented fix for a divider wired the other way round - the subtraction
    # handles a negative span on its own.
    on_value:
      - lambda: |-
          if (std::isnan(x)) {
            return;
          }
          const float span = ${AMBIENT_BRIGHT}f - ${AMBIENT_DARK}f;
          float t = (span == 0.0f) ? 1.0f : (x - ${AMBIENT_DARK}f) / span;
          t = std::min(std::max(t, 0.0f), 1.0f);
          id(global_ambient_dim) = ${MIN_FACE_BRIGHTNESS}f + (1.0f - ${MIN_FACE_BRIGHTNESS}f) * t;

  #
  # Reset Count
  #
  # Pushed once from the late on_boot block, see reset_count_id for why the
  # increment cannot happen there too.
  #
  - platform: template
    id: reset_count_sensor_id
    name: Reset Count
    icon: mdi:restart-alert
    state_class: total_increasing
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      return id(reset_count_id);

#
# https://esphome.io/components/script
#
script:

  #
  # The boot handover: leave the Twinkle indicator and show the clock face.
  #
  # Called from three places that each know only part of what is needed - wifi:
  # on_connect knows the radio associated, time: on_time_sync knows a network
  # sync landed, and the late on_boot block knows the DS1307 has been read - so
  # the conditions live here once instead of being part-checked three times.
  #
  # Both guards earn their place:
  #
  #   Twinkle   on_connect fires again after every reconnect and on_time_sync
  #             every time SNTP re-syncs. Without this, a clock that jumped back
  #             to the time face because the access point hiccupped would undo
  #             whatever was selected in Home Assistant.
  #
  #   is_valid  the Time effect blanks the ring when the clock is invalid. An
  #             access point with no route to the internet satisfies on_connect
  #             but yields no SNTP, and switching over then would trade a
  #             visible "waiting" indicator for a black ring. With the RTC
  #             fitted this is what decides the network-less boot: a readable
  #             DS1307 makes it true before the radio is anywhere, an absent
  #             or halted one leaves Twinkle up until SNTP arrives.
  #
  # mode: single - two callers can race on the first successful boot, and the
  # second run would only re-evaluate a guard that no longer holds.
  #
  - id: show_clock
    mode: single
    then:
      - if:
          condition:
            and:
              - lambda: return id(led_ring_id).get_effect_name().str() == "Twinkle";
              - lambda: return id(sntp_time).now().is_valid();
          then:
            - light.turn_on:
                id: led_ring_id
                brightness: ${DEFAULT_BRIGHTNESS}
                red: ${IDLE_RED}
                green: ${IDLE_GREEN}
                blue: ${IDLE_BLUE}
                effect: Time

  #
  # mode: restart, so an alarm that fires while a previous one is still running
  # starts its timer over instead of queueing a second stand-down.
  #
  - id: alarm_script
    mode: restart
    then:
      - lambda: |-
          id(global_alarm_was_on) = id(led_ring_id).remote_values.is_on();

      # turn_on rather than only setting the effect: the ring may well be off at
      # the time, which is rather the point of an alarm.
      - light.turn_on:
          id: led_ring_id
          brightness: 100%
          effect: Alarm

      # Minutes to milliseconds. The number entity is the only thing that
      # decides how long this runs.
      - delay: !lambda |-
          return (uint32_t) (id(alarm_duration_id).state * 60000.0f);

      # Only stand down if the alarm is still what is showing. Someone who
      # silenced it by picking another effect - or by switching the ring off -
      # has already dealt with it, and yanking the display out from under them
      # minutes later would be worse than doing nothing.
      - if:
          condition:
            lambda: return id(led_ring_id).get_effect_name().str() == "Alarm";
          then:
            - if:
                condition:
                  lambda: return id(global_alarm_was_on);
                then:
                  - light.turn_on:
                      id: led_ring_id
                      brightness: ${DEFAULT_BRIGHTNESS}
                      red: ${IDLE_RED}
                      green: ${IDLE_GREEN}
                      blue: ${IDLE_BLUE}
                      effect: Time
                else:
                  - light.turn_off: led_ring_id

#
# https://esphome.io/components/number/template
#
# How long the alarm pulses before standing down on its own. There is
# deliberately no snooze - this is a clock, not a bedside console.
#
number:
  - platform: template
    id: alarm_duration_id
    name: Alarm Duration
    icon: mdi:timer-outline
    unit_of_measurement: min
    mode: box
    min_value: 1
    max_value: 10
    step: 1
    initial_value: 3
    optimistic: true
    restore_value: true
    entity_category: config

#
# https://esphome.io/components/datetime/template
#
# Turns the Alarm effect from something you pick by hand into an actual alarm.
# The trigger fires on the local wall clock, so it follows the sntp timezone.
#
# type: TIME, not DATETIME: an alarm clock repeats daily, and a date would mean
# re-arming it every night.
#
datetime:
  - platform: template
    id: alarm_time_id
    name: Alarm Time
    icon: mdi:alarm
    type: TIME
    optimistic: true
    restore_value: true
    initial_value: "09:00:00"
    on_time:
      - if:
          condition:
            switch.is_on: alarm_enabled_id
          then:
            - script.execute: alarm_script

#
# https://esphome.io/components/switch/template
#
switch:

  #
  # MQTT
  #
  # Brings the broker connection up or down without reflashing.
  #
  # Deliberately NOT mirroring the real state with a lambda: the only getter is
  # is_connected(), so the switch would snap back to off whenever the broker is
  # briefly unreachable and look broken. This reports what was asked for, not
  # what the network is doing.
  #
  # Visible, unlike the same switch in dew-point-ventilation.yaml, where it is
  # internal. The reasoning there is that switching mqtt off over mqtt removes
  # the entity that would switch it back on - but this device publishes its
  # entities over the native API, with mqtt discovery off entirely, so the
  # switch survives its own use.
  #
  # Worth knowing: "esphome logs" finds this device by asking the broker on
  # esphome/discover/${project_name}. With mqtt off - the default - it needs the
  # IP or the mDNS name instead:
  #
  #   esphome logs ${project_name}.yaml --device ${project_name}.local
  #
  # ALWAYS_OFF rather than RESTORE_DEFAULT_OFF, deliberately: mqtt off is the
  # intended state after every boot, not merely the initial one. Persisting an
  # "on" across a restart would quietly undo that.
  #
  - platform: template
    id: mqtt_state_id
    name: MQTT
    icon: mdi:transit-connection-variant
    optimistic: True
    restore_mode: ALWAYS_OFF
    entity_category: config
    turn_on_action:
      then:
        - mqtt.enable:
    turn_off_action:
      then:
        - mqtt.disable:

  #
  # Arms the Alarm Time trigger. Separate from the time itself so the alarm can
  # be silenced for a night without losing the setting.
  #
  - platform: template
    name: Alarm Enabled
    icon: mdi:alarm-check
    id: alarm_enabled_id
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  #
  # Kept optimistic on purpose: the state lives in global_enable_seconds, which
  # the effect reads at frame rate, so there is nothing to read back from.
  #
  # restore_mode is spelled out because the schema default is ALWAYS_OFF - the
  # setting was silently lost on every reboot. Restoring also re-runs
  # turn_on_action, so the global gets seeded from the stored state and the
  # global itself does not need to persist.
  #
  - platform: template
    name: Enable seconds
    icon: mdi:clock-outline
    id: infinity_enable_seconds
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      then:
        lambda: |-
          id(global_enable_seconds) = 1;
    turn_off_action:
      then:
        lambda: |-
          id(global_enable_seconds) = 0;

#
# Hand colours as "#RRGGBB". These entities ARE the stored value - the Time
# effect reads id(...).state directly and parses it, so there is no global to
# keep in sync and no set_action to write one. That replaces the previous
# arrangement, where three restoring globals shadowed these three entities and
# nothing ever read either side.
#
# restore_value persists the user's palette across a power cut; initial_value
# only applies on the very first boot. min_length is 7 as well as max_length:
# anything shorter cannot be a valid #RRGGBB, and rejecting it in the schema is
# better than silently falling back in the effect on every frame.
#
# https://esphome.io/components/text/template
#
text:

  - platform: template
    name: Color hour
    icon: mdi:palette
    id: infinity_color_hour
    mode: text
    optimistic: true
    restore_value: true
    entity_category: config
    min_length: 7
    max_length: 7
    initial_value: '#1006cd'

  - platform: template
    name: Color minute
    icon: mdi:palette
    id: infinity_color_minute
    mode: text
    optimistic: true
    restore_value: true
    entity_category: config
    min_length: 7
    max_length: 7
    initial_value: '#d200b6'

  - platform: template
    name: Color second
    icon: mdi:palette
    id: infinity_color_second
    mode: text
    optimistic: true
    restore_value: true
    entity_category: config
    min_length: 7
    max_length: 7
    initial_value: '#2DFF49'

  #
  # Where the device is, in decimal degrees, north and east positive. The
  # astronomy interval parses these and computes the real solar and lunar
  # position from them, so they decide when the Sun effect's ring starts to
  # light and how far it opens, and where the Moon effect puts its arc.
  #
  # Text rather than number entities because a number would need a fixed step
  # and these want free decimals; and text so they can be corrected from Home
  # Assistant without a reflash. Anything unparseable or out of range falls back
  # to DEFAULT_LATITUDE / DEFAULT_LONGITUDE rather than throwing away the frame.
  #
  - platform: template
    name: Latitude
    icon: mdi:latitude
    id: latitude_text_id
    mode: text
    optimistic: true
    restore_value: true
    entity_category: config
    min_length: 1
    max_length: 12
    initial_value: '${DEFAULT_LATITUDE}'

  - platform: template
    name: Longitude
    icon: mdi:longitude
    id: longitude_text_id
    mode: text
    optimistic: true
    restore_value: true
    entity_category: config
    min_length: 1
    max_length: 12
    initial_value: '${DEFAULT_LONGITUDE}'

#
# The option ORDER is load-bearing: the Time effect switches on
# active_index(), and its FACETYPE_* / INDICATOR_* constants are the positions
# in these lists. Reordering or inserting an option silently remaps the face.
# Renaming one is safe - restore_value stores the index too.
#
# The Indicator options name POSITIONS on the dial, not times of day. "12
# o'clock" was "Show midday", which is wrong for half of every day: pixel 0 is
# where both noon and midnight land. "Quarters" was "Show quadrants" - what it
# draws are the four marks at 12, 3, 6 and 9, not the sectors between them. The
# redundant "Show " prefix went with them, since the entity is already called
# Indicator and the first option is plain "Off".
#
# restore_value on both: without it the schema default is false and every reboot
# reset the face to Normal / Off. initial_option only applies on the very first
# boot now, or after a factory reset.
#
# https://esphome.io/components/select/template
#
select:

  - platform: template
    name: Face type
    icon: mdi:clock-time-two-outline
    id: infinity_face_type
    options:
      - "Normal"
      - "Simple"
      - "Gradient"
    initial_option: "Normal"
    optimistic: true
    restore_value: true

  # The first option is "Off" and NOT "None" on purpose. Home Assistant's MQTT
  # integration treats the literal payload "None" as its PAYLOAD_NONE sentinel,
  # meaning "no state" - an MQTT select sitting on that value reads as "unknown"
  # in the UI instead of showing the selected entry. Renaming is safe here
  # because the Time effect switches on active_index(), and restore_value
  # stores the index too, so nothing depends on the string.
  - platform: template
    name: Indicator
    icon: mdi:form-select
    id: infinity_indicator
    options:
      - "Off"
      - "12 o'clock"
      - "Quarters"
      - "Hour marks"
    initial_option: "Off"
    optimistic: true
    restore_value: true

#
# The clock face itself. The five animations written for this device - Time,
# Alarm, Fire, Sun and Moon - are addressable_lambdas rather than an external
# component or a header in esphome.includes, which keeps the whole device in
# this one file. Five stock effects follow them; see the note above those for
# what sets the two groups apart.
#
# https://esphome.io/components/light/esp32_rmt_led_strip
#
light:
  - platform: esp32_rmt_led_strip
    id: led_ring_id
    name: LED color
    icon: mdi:led-outline
    chipset: WS2811
    rgb_order: GRB
    pin: ${PIN_LED}
    num_leds: ${NUM_LEDS}
    default_transition_length: 1s

    # The schema default is 2.8, which is right for a light you dim by hand: it
    # makes the dimmer curve look linear to the eye. It is wrong here, because
    # every effect below computes its own gradient - gamma is then applied on
    # top of maths that already decided what each pixel should look like, and it
    # crushes the dark end of the hour/minute blend into black. 1.0 hands the
    # computed value straight to the LED.
    gamma_correct: 1.0

    effects:

      #
      # The clock face. Hour and minute hand are drawn as a gradient around the
      # ring, so the two arcs between them carry the reading even when a hand
      # sits behind the other.
      #
      - addressable_lambda:
          name: Time
          # 50ms, down from 500ms originally. Two reasons, and neither is the
          # one that used to be written here ("the smallest thing shown is a
          # second, so anything faster is wasted") - that is true of the CONTENT
          # and wrong for everything else.
          #
          # Latency: the display only moves on the first frame after a second
          # boundary, so the render period is exactly how late the second hand
          # can be.
          #
          # Smoothness: the hands now fade between pixels over HAND_FADE_MS, and
          # the render period is the step size of that fade. At the 999ms fade
          # set above this gives twenty steps; at the old 500ms render period
          # it would have given two, which is not a fade at all.
          #
          # Still nowhere near the 0ms default, which re-rendered on every
          # main-loop pass. At 20 Hz this lambda costs a fraction of a percent
          # of a core.
          update_interval: 50ms
          lambda: |-
            // face types
            constexpr int FACETYPE_NORMAL = 0;
            constexpr int FACETYPE_SIMPLE = 1;
            constexpr int FACETYPE_GRADIENT = 2;

            // indicators
            constexpr int INDICATOR_OFF = 0;
            constexpr int INDICATOR_TWELVE = 1;
            constexpr int INDICATOR_QUARTERS = 2;
            constexpr int INDICATOR_HOUR_MARKS = 3;

            auto linearBlend = [](Color left, Color right, float progress) -> Color {
              return Color(left.r + ((right.r - left.r) * progress),
                           left.g + ((right.g - left.g) * progress),
                           left.b + ((right.b - left.b) * progress));
            };

            // Scales a colour towards black. Multiplicative on purpose - see
            // GRADIENT_DIM for why subtracting a fixed delta was wrong.
            auto darken = [](Color color, float factor) -> Color {
              return Color(color.r * factor, color.g * factor, color.b * factor);
            };

            // A dial mark: the pixel is set to the inverse of what surrounds
            // it, so it stays readable whatever the face underneath is doing.
            //
            // Inverting per CHANNEL, which this did, does not give that. The
            // inverse of a saturated colour is its COMPLEMENT, so a red arc got
            // a cyan mark and a green one magenta - hues that appear nowhere
            // else on the face and read as a fault rather than as a marking.
            // The comment here used to claim the result was white on the main
            // face; that only ever held where the surround was near black.
            //
            // Inverting the LUMINANCE keeps the contrast that was the point of
            // the inversion and drops the hue: a neutral grey, bright over a
            // dark surround and dark over a bright one, and never a colour the
            // palette does not contain.
            auto invertLED = [&](int32_t i) {
              const Color around = linearBlend(it[(i - 1 + it.size()) % it.size()].get(),
                                               it[(i + 1) % it.size()].get(), 0.5f);

              // Rec. 601 weights rather than a flat (r+g+b)/3: the eye takes
              // almost none of its brightness from blue and most of it from
              // green, so a flat mean calls a saturated blue surround
              // mid-bright and answers it with a dark mark nobody can see.
              const float luma = 0.299f * around.r + 0.587f * around.g + 0.114f * around.b;
              const uint8_t level = (uint8_t) std::max(255.0f - luma, 0.0f);
              it[i] = Color(level, level, level);
            };

            // Reads "#RRGGBB" from a Color * text entity. Parsed per frame on
            // purpose: it is a handful of instructions, and it means an edit in
            // Home Assistant shows on the next frame without any cache to
            // invalidate. Anything unparseable falls back rather than throwing
            // away the frame.
            auto parseColor = [](const std::string &hex, Color fallback) -> Color {
              if (hex.length() != 7 || hex[0] != '#') {
                return fallback;
              }
              char *end = nullptr;
              const long value = strtol(hex.c_str() + 1, &end, 16);
              if (end != hex.c_str() + 7) {
                return fallback;
              }
              return Color((value >> 16) & 0xFF, (value >> 8) & 0xFF, value & 0xFF);
            };

            auto time = id(sntp_time).now();

            int hour = time.hour;
            int minute = time.minute;
            int second = time.second;

            // Blank rather than a bare return. Returning left the previous
            // frame standing, so a device that came up without a clock showed
            // the idle colour at full brightness and looked like a working
            // lamp - the one failure mode that must not look like success.
            if (!time.is_valid()) {
              if (id(global_debug) < 1) {
                ESP_LOGE("lambda", "Got invalid time from sntp_time. Time is: %i:%i", hour, minute);
                id(global_debug) = 1;
              }
              for (int k = 0; k < it.size(); k++) {
                it[k] = Color(0, 0, 0);
              }
              return;
            }

            // Pixel positions on the ring. An index is a MINUTE, so the hour
            // hand belongs at (hour % 12) * 5 - the extra minute/12 makes it
            // creep forward through the hour instead of jumping on the hour,
            // the way a real hour hand moves.
            //
            // This used to index the ring with time.hour directly. On a 60
            // pixel dial that put the hour hand at "hour minutes past": pixel 9
            // at 09:45 where it belongs at 48, pixel 23 at 23:00 where it
            // belongs at 55. It was only ever right at midnight, and it never
            // left the top half of the dial. Worse, firsthand/secondhand below
            // then compared an 0-23 hour against an 0-59 minute - two different
            // units - so which hand counted as "first", and with it the whole
            // gradient, was decided by a meaningless comparison.
            const int hour_pos = ((hour % 12) * 60 + minute) / 12;
            const int minute_pos = minute;

            auto face_type = id(infinity_face_type).active_index();
            auto indicator = id(infinity_indicator).active_index();
            auto enable_seconds = id(global_enable_seconds);

            // this face colours the clock in 2 sections, the c1->c2 divide
            // represents the minute hand and the c2->c1 divide represents the hour hand.
            Color c1;
            Color c1blend;
            Color c2;
            Color c2blend;

            int gap;
            int firsthand = std::min(hour_pos, minute_pos);
            int secondhand = std::max(hour_pos, minute_pos);

            Color hour_color = parseColor(id(infinity_color_hour).state, Color(255, 0, 0));
            Color minute_color = parseColor(id(infinity_color_minute).state, Color(0, 255, 0));
            Color second_color = parseColor(id(infinity_color_second).state, Color(0, 0, 255));

            // check which hand is first, so we know what colour the 0 pixel is
            //
            // The else branch used to build c1 as (r, b, g) - green and blue
            // swapped. That was invisible while hour_color was hard-coded pure
            // red, but the colour is user-supplied now, so any hand colour with
            // two components would have rendered differently depending on
            // whether the hour or the minute hand came first.
            if (hour_pos > minute_pos) {
              c2 = Color(hour_color.r, hour_color.g, hour_color.b);
              c1 = Color(minute_color.r, minute_color.g, minute_color.b);
            } else {
              c1 = Color(hour_color.r, hour_color.g, hour_color.b);
              c2 = Color(minute_color.r, minute_color.g, minute_color.b);
            }

            // Each arc runs from its blend colour at the hand it starts on to
            // the full hand colour at the far end. FACE_BLEND is how far towards
            // the OTHER hand's colour that starting point is pulled, so a bigger
            // value is a wider, more obvious ramp and 0 is two flat arcs.
            //
            // This used to read `(float) blendPoint / 255` with blendPoint set
            // to 0.5 - a blend factor of 0.00196. With the default palette that
            // put each arc between (209,0,182) and (210,0,182): one step of one
            // channel over thirty pixels. The face rendered as two solid arcs
            // and the comment here promised a gradient that was never drawn. The
            // /255 is the leftover; blendPoint was clearly once an int 0-255.
            c2blend = linearBlend(c2, c1, ${FACE_BLEND}f);
            c1blend = linearBlend(c1, c2, ${FACE_BLEND}f);

            // "Simple" shows the hands as bare dots, so there is no gradient to
            // build. The ring has to be cleared explicitly: the frame buffer is
            // live and still holds whatever the last frame drew, so without
            // this the gradient from before the switch would simply stay put.
            const size_t faceType = face_type.value_or(FACETYPE_NORMAL);

            if (faceType == FACETYPE_SIMPLE) {
              for (int i = 0; i < it.size(); i++) {
                it[i] = Color(0, 0, 0);
              }
            } else if (faceType == FACETYPE_GRADIENT) {
              // Two ramps, each spanning one of the arcs between the hands:
              // hour colour to minute colour going clockwise from the hour
              // hand, and minute back to hour over the remainder. Both ends of
              // each ramp land exactly on a hand, so the ring closes on itself
              // with no seam.
              //
              // Drawn dimmed, because a gradient is by definition almost the
              // same colour either side of any point on it - at full strength
              // the hands would be indistinguishable from their surroundings.
              // They are painted over this at full colour further down.
              const int span = (minute_pos - hour_pos + it.size()) % it.size();
              const int back = it.size() - span;

              for (int k = 0; k <= span; k++) {
                const float t = (span == 0) ? 0.0f : (float) k / (float) span;
                it[(hour_pos + k) % it.size()] =
                    darken(linearBlend(hour_color, minute_color, t), ${GRADIENT_DIM}f);
              }

              for (int k = 0; k <= back; k++) {
                const float t = (back == 0) ? 0.0f : (float) k / (float) back;
                it[(minute_pos + k) % it.size()] =
                    darken(linearBlend(minute_color, hour_color, t), ${GRADIENT_DIM}f);
              }
            } else {
              gap = secondhand - firsthand;

              // create the blend between first and 2nd hand
              for (int i = firsthand; i < secondhand; i++) {
                it[i] = linearBlend(c2blend, c2, ((float) i - (float) firsthand) / (float) gap);
              }

              gap = it.size() - gap;

              // and the last hand
              for (int i = secondhand; i < it.size() + firsthand; i++) {
                it[i % it.size()] = linearBlend(c1blend, c1, ((float) i - (float) secondhand) / (float) gap);
              }
            }

            // --- Hand movement
            //
            // Each hand remembers when it last stepped, and is drawn as a short
            // comet sliding from its previous pixel to the current one: the new
            // pixel fades in, the old fades out, and a tail of dimming pixels
            // follows behind. Without this a hand simply teleports, which on a
            // ring of discrete pixels reads as two separate states rather than
            // as movement.
            //
            // The positions are recomputed from the clock every frame, so the
            // only state kept here is WHEN each one last changed.
            constexpr uint32_t FADE_MS = ${HAND_FADE_MS};
            constexpr float TAIL = ${HAND_TAIL}f;

            const uint32_t now_ms = millis();

            static int last_hour_pos = -1;
            static int last_minute_pos = -1;
            static int last_second_pos = -1;
            static uint32_t hour_changed_ms = 0;
            static uint32_t minute_changed_ms = 0;
            static uint32_t second_changed_ms = 0;

            // -1 forces all three to register a step on the next line, so the
            // hands fade in when the effect is selected instead of appearing
            // mid-tail with a stale age behind them.
            if (initial_run) {
              last_hour_pos = -1;
              last_minute_pos = -1;
              last_second_pos = -1;
            }

            if (hour_pos != last_hour_pos) {
              last_hour_pos = hour_pos;
              hour_changed_ms = now_ms;
            }
            if (minute_pos != last_minute_pos) {
              last_minute_pos = minute_pos;
              minute_changed_ms = now_ms;
            }
            if (second != last_second_pos) {
              last_second_pos = second;
              second_changed_ms = now_ms;
            }

            auto fadeOf = [&](uint32_t since) -> float {
              const uint32_t age = now_ms - since;
              return (age >= FADE_MS) ? 1.0f : (float) age / (float) FADE_MS;
            };

            // Draws one comet. The head slides from pos-1 to pos as fade runs
            // 0 -> 1, so d = 0 is the pixel being faded IN and everything above
            // it is the tail being faded out.
            //
            // Blended into whatever is already there rather than overwriting:
            // on the Simple face that background is black and this reads as a
            // pure comet, on Normal and Gradient it is a highlight that melts
            // back into the ramp.
            auto drawHand = [&](int pos, Color color, float fade) {
              for (int d = 0; d <= (int) TAIL + 1; d++) {
                const float s = (float) d - 1.0f + fade;

                float level;
                if (s < 0.0f) {
                  level = 1.0f + s;
                } else if (s <= TAIL) {
                  level = 1.0f - s / TAIL;
                } else {
                  continue;
                }

                if (level <= 0.0f) {
                  continue;
                }

                const int i = ((pos - d) % it.size() + it.size()) % it.size();
                it[i] = linearBlend(it[i].get(), color, level);
              }
            };

            // Dial marks, drawn before the hands so they belong to the FACE:
            // each one is computed from the background alone, and the hands
            // then pass over them.
            //
            // Between the hands and the seconds, where this used to sit, every
            // mark was instead computed from whatever the hour and minute
            // comets had just painted beside it - so a mark shifted as a hand
            // slid past and settled back once it had gone, once a minute.
            switch (indicator.value_or(INDICATOR_OFF)) {
              default:
                break;
              case INDICATOR_OFF:
                break;
              case INDICATOR_TWELVE:
                // one mark at the top of the dial, to orient the reader
                invertLED(0);
                break;
              case INDICATOR_QUARTERS:
                for (int i = 0; i < 4; i++) {
                  invertLED(i * it.size() / 4);
                }
                break;
              case INDICATOR_HOUR_MARKS:
                for (int i = 0; i < 12; i++) {
                  invertLED(i * it.size() / 12);
                }
                break;
            }

            // Drawn for every face type, and after the background and the dial
            // marks, so the hands sit on top of both rather than being blended
            // into them.
            drawHand(hour_pos, hour_color, fadeOf(hour_changed_ms));
            drawHand(minute_pos, minute_color, fadeOf(minute_changed_ms));

            if (enable_seconds) {
              drawHand(second, second_color, fadeOf(second_changed_ms));
            }

            // Ambient dimming. The factor is computed once on the Brightness
            // sensor - see global_ambient_dim - so every effect that follows
            // the room light applies it the same way.
            const float dim = id(global_ambient_dim);
            if (dim < 0.999f) {
              for (int k = 0; k < it.size(); k++) {
                const Color c = it[k].get();
                it[k] = Color(c.r * dim, c.g * dim, c.b * dim);
              }
            }

      #
      # Red pulse.
      #
      - addressable_lambda:
          name: Alarm
          update_interval: 30ms
          lambda: |-
            // The original ran both ramps, 0 -> 255 and back, inside a single
            // call. Nothing is shown between writes to the frame buffer, so only
            // the last pass survived - the strip rendered flat black and the
            // effect did nothing at all. The ramp has to advance one step per
            // FRAME, which is what the counter below does.
            //
            // 8 per 30ms frame is ~1s per ramp, so a full pulse takes ~2s.
            constexpr int STEP = 8;

            static int level = 0;
            static int direction = 1;

            if (initial_run) {
              level = 0;
              direction = 1;
            }

            level += direction * STEP;

            if (level >= 255) {
              level = 255;
              direction = -1;
            } else if (level <= 0) {
              level = 0;
              direction = 1;
            }

            // Deliberately NOT dimmed by global_ambient_dim, unlike every
            // other effect here: an alarm that turns itself down in a dark room
            // is an alarm that fails at the one time it is needed.
            // The / 255 is load-bearing, not decoration. level is an int and so
            // are the substitutions: ${ALARM_RED} * level reaches 65025, and
            // Color takes uint8_t, so the value that actually reached the LED
            // was (255 * level) & 0xFF == 256 - level. The pulse ran backwards.
            const Color color = Color(${ALARM_RED} * level / 255,
                                      ${ALARM_GREEN} * level / 255,
                                      ${ALARM_BLUE} * level / 255);
            for (int i = 0; i < it.size(); i++) {
              it[i] = color;
            }

      #
      # Fire simulation, mirrored across both halves of the ring.
      #
      - addressable_lambda:
          name: Fire
          # The cooling/diffusion model assumes a fixed step rate - the original
          # had a speedDelay parameter for exactly this. Running it once per
          # main-loop pass burns the heat buffer down far faster than the sparks
          # can refill it, which looks like noise rather than flames.
          update_interval: 30ms
          lambda: |-
            // All three are tunable at the top of this file, with the reasoning
            // for the values on the substitutions themselves.
            constexpr int cooling = ${FIRE_COOLING};
            constexpr int sparking = ${FIRE_SPARKING};
            constexpr uint8_t maxHeat = ${FIRE_MAX_HEAT};

            constexpr int MAX_PIXELS = 128;

            int numPixels = it.size() / 2;
            if (numPixels > MAX_PIXELS) {
              numPixels = MAX_PIXELS;
            }

            // has to survive between frames, otherwise cooling and diffusion
            // operate on a fresh (uninitialised) buffer every single frame
            static uint8_t heat[MAX_PIXELS] = {};
            static uint16_t rand16seed = 0;

            // Without this the seed is 0 on every boot and the fire replays the
            // exact same sequence of sparks each time - identical flames after
            // every restart.
            if (initial_run) {
              rand16seed = (uint16_t) millis();
            }

            // Generate an 8-bit random number
            auto random8 = [&]() -> uint8_t {
              rand16seed = (rand16seed * (uint16_t) 2053) + (uint16_t) 13849;
              // return the sum of the high and low bytes, for better
              // mixing and non-sequential correlation
              return (uint8_t)(((uint8_t)(rand16seed & 0xFF)) + ((uint8_t)(rand16seed >> 8)));
            };

            // Generate an 8-bit random number between 0 and lim
            auto random8_max = [&](uint8_t lim) -> uint8_t {
              return ((uint16_t) random8() * lim) >> 8;
            };

            // Generate an 8-bit random number in the given range
            auto random8_range = [&](uint8_t min_value, uint8_t lim) -> uint8_t {
              return random8_max(lim - min_value) + min_value;
            };

            // subtract one byte from another, saturating at 0x00
            auto qsub8 = [](uint8_t i, uint8_t j) -> uint8_t {
              int t = i - j;
              return (t < 0) ? 0 : t;
            };

            // add one byte to another, saturating at 0xFF
            auto qadd8 = [](uint8_t i, uint8_t j) -> uint8_t {
              unsigned int t = i + j;
              return (t > 255) ? 255 : t;
            };

            auto getHeatColor = [](uint8_t temperature) -> Color {
              Color heatcolor = Color(0, 0, 0);

              // Scale 'heat' down from 0-255 to 0-191,
              // which can then be easily divided into three
              // equal 'thirds' of 64 units each.
              uint8_t t192 = std::round((temperature / 255.0) * 191);

              // calculate a value that ramps up from
              // zero to 255 in each 'third' of the scale.
              uint8_t heatramp = t192 & 0x3F; // 0..63
              heatramp <<= 2;                 // scale up to 0..252

              // now figure out which third of the spectrum we're in:
              if (t192 & 0x80) {
                // we're in the hottest third
                heatcolor.r = 255;      // full red
                heatcolor.g = 255;      // full green
                heatcolor.b = heatramp; // ramp up blue
              } else if (t192 & 0x40) {
                // we're in the middle third
                heatcolor.r = 255;      // full red
                heatcolor.g = heatramp; // ramp up green
                heatcolor.b = 0;        // no blue
              } else {
                // we're in the coolest third
                heatcolor.r = heatramp; // ramp up red
                heatcolor.g = 0;        // no green
                heatcolor.b = 0;        // no blue
              }

              return heatcolor;
            };

            // Step 1. Cool down every cell a little
            for (int i = 0; i < numPixels; i++) {
              heat[i] = qsub8(heat[i], random8_range(0, ((cooling * 10) / numPixels) + 2));
            }

            // Step 2. Heat from each cell drifts 'up' and diffuses a little
            for (int k = numPixels - 1; k >= 2; k--) {
              heat[k] = (heat[k - 1] + heat[k - 2] + heat[k - 2]) / 3;
            }

            // Step 3. Randomly ignite new 'sparks' of heat near the bottom
            if (random8() < sparking) {
              int y = random8_max(7);
              heat[y] = qadd8(heat[y], random8_range(160, 255));
            }

            // Step 4. Map from heat cells to LED colors, mirrored across the
            // ring: the base sits at numPixels - 1 / numPixels and the two
            // flames rise in opposite directions to meet at 0 / size - 1.
            //
            // The second index used to be numPixels - j, which covered
            // numPixels down to 1 - so pixel 0 was never written at all and
            // kept whatever the previous effect had left there, while pixel
            // numPixels got written twice. The stale pixel sat exactly where
            // the two flame tips meet, which is where it showed most.
            for (int j = 0; j < numPixels; j++) {
              // calculate color temperature, clamped short of the white end of
              // the palette - see FIRE_MAX_HEAT
              Color color = getHeatColor(std::min(heat[j], maxHeat));

              // forward the flames
              it[numPixels + j] = color;
              // reverse the flames
              it[numPixels - 1 - j] = color;
            }

            // Ambient dimming. The factor is computed once on the Brightness
            // sensor - see global_ambient_dim - so every effect that follows
            // the room light applies it the same way.
            const float dim = id(global_ambient_dim);
            if (dim < 0.999f) {
              for (int k = 0; k < it.size(); k++) {
                const Color c = it[k].get();
                it[k] = Color(c.r * dim, c.g * dim, c.b * dim);
              }
            }

      #
      # Real-time simulation of the sun. The ring lights at 12 o'clock the
      # moment the sun clears the horizon and opens outwards from there as it
      # climbs, reaching the full circle at solar noon; the colour follows the
      # sun's own, red at the horizon through orange and yellow to daylight.
      # Below the horizon the ring is dark.
      #
      # This replaces a ramp that ran on its own frame counter over a fixed
      # duration and had nothing to do with the sky.
      #
      - addressable_lambda:
          name: Sun
          # The sun moves about 0.004 degrees per second. Over ten seconds that
          # is far less than one pixel of arc, so anything faster would only
          # burn cycles. The position itself is not computed here at all - the
          # astronomy interval does that on its own 10s clock and leaves it in
          # a global, so this rate only decides how often the arc is redrawn.
          update_interval: 10s
          lambda: |-
            // Position comes from the astronomy interval, so this lambda only
            // has to draw. NAN means the clock has no time yet.
            const float elevation = id(global_sun_elevation);
            const float maxElevation = id(global_sun_max_elevation);

            // below the horizon, or no clock: there is no sun to show
            if (std::isnan(elevation) || elevation <= 0.0f) {
              for (int j = 0; j < it.size(); j++) {
                it[j] = Color(0, 0, 0);
              }
              return;
            }

            const float spread = (maxElevation > 0.0f)
                                   ? std::min(elevation / maxElevation, 1.0f)
                                   : 0.0f;

            // Colour by elevation, over the red - orange - yellow - white curve
            // the original ramp used. Its segment boundaries at 142, 204 and
            // 280 are what give the sunrise its shape, so they are kept and
            // only the input changed: elevation instead of a frame counter.
            const int i = (int) (std::min(elevation / ${SUN_WHITE_ELEVATION}f, 1.0f) * 280.0f);

            int red_ramp = std::max(142, i);

            int green_ramp;
            if (i < 142) {
              green_ramp = i * 64 / 142;
            } else if (i < 204) {
              green_ramp = 64 + (i - 142) * 128 / 62;
            } else {
              green_ramp = 192 + (i - 204) * 64 / 51;
            }

            int blue_ramp = (i > 204) ? (5 * i - 1020) : 0;

            red_ramp = std::min(red_ramp, 255);
            green_ramp = std::min(green_ramp, 255);
            blue_ramp = std::min(blue_ramp, 255);

            const Color sky = Color(red_ramp, green_ramp, blue_ramp);

            // The arc is centred on pixel 0 - 12 o'clock - and opens both ways.
            // The boundary pixel is dimmed by the fractional part so the light
            // creeps outwards smoothly, and the +1 closes the ring at noon
            // instead of leaving the pixel opposite dark.
            const float half = spread * (float) it.size() / 2.0f;

            for (int j = 0; j < it.size(); j++) {
              int dist = j;
              if (dist > it.size() / 2) {
                dist = it.size() - dist;
              }

              const float level = std::min(std::max(half - (float) dist + 1.0f, 0.0f), 1.0f);
              it[j] = Color(sky.r * level, sky.g * level, sky.b * level);
            }

            // Ambient dimming, see global_ambient_dim.
            const float dim = id(global_ambient_dim);
            if (dim < 0.999f) {
              for (int k = 0; k < it.size(); k++) {
                const Color c = it[k].get();
                it[k] = Color(c.r * dim, c.g * dim, c.b * dim);
              }
            }

      #
      # Current moon phase as a lit segment.
      #
      - addressable_lambda:
          name: Moon
          # The moon moves about half a degree an hour, and the arc changes by
          # roughly two pixels a day. 10s matches the Sun effect; like it, the
          # position and phase are computed by the astronomy interval rather
          # than here, so this only sets the redraw rate.
          update_interval: 10s
          lambda: |-
            // Position and phase come from the astronomy interval; this lambda
            // only draws. NAN means the clock has no time yet.
            const float altitude = id(global_moon_altitude);
            const float illuminated = id(global_moon_illuminated);

            // Below the horizon there is no moon to show. Altitude of the
            // centre, so this is a few minutes off the almanac's definition,
            // which uses the upper limb and allows for refraction.
            if (std::isnan(altitude) || altitude <= 0.0f) {
              for (int j = 0; j < it.size(); j++) {
                it[j] = Color(0, 0, 0);
              }
              return;
            }

            // in pixels, fractional so the arc grows smoothly across the month
            const float lit = illuminated * (float) it.size();

            // The lit limb faces the sun: right while waxing seen from the
            // northern hemisphere, and mirrored south of the equator. At full
            // moon the arc closes and the centre stops mattering.
            const bool northern = id(latitude_text_id).state.empty() ||
                                  strtof(id(latitude_text_id).state.c_str(), nullptr) >= 0.0f;
            const int centre = (id(global_moon_waxing) == northern) ? (it.size() / 4)
                                                                    : (3 * it.size() / 4);

            for (int j = 0; j < it.size(); j++) {
              // distance from the centre of the arc, the short way round
              int dist = std::abs(j - centre);
              if (dist > it.size() / 2) {
                dist = it.size() - dist;
              }

              // The arc covers lit pixels in total, so lit/2 either side. The
              // +1 closes the ring at full moon; the fractional result dims the
              // boundary pixel so a crescent does not step a whole pixel at a
              // time.
              float level = 0.0f;
              if (lit >= 1.0f) {
                level = std::min(std::max(lit / 2.0f - (float) dist + 1.0f, 0.0f), 1.0f);
              }

              const uint8_t v = (uint8_t) (${MOON_BRIGHTNESS} * level);
              it[j] = Color(v, v, v);
            }

            // Ambient dimming, see global_ambient_dim.
            const float dim = id(global_ambient_dim);
            if (dim < 0.999f) {
              for (int k = 0; k < it.size(); k++) {
                const Color c = it[k].get();
                it[k] = Color(c.r * dim, c.g * dim, c.b * dim);
              }
            }

      #
      # The stock decorative effects. Two things set them apart from the five
      # lambdas above, and neither was written down before:
      #
      # They do NOT follow the room light. global_ambient_dim is applied inside
      # each lambda, and these are built-ins with no lambda to apply it in - so
      # Rainbow at night stays as bright as the light's own brightness setting
      # says. Turn the brightness down by hand, or pick a face that dims itself.
      #
      # Twinkle carries a second job: it is the boot indicator. on_boot selects
      # it and the show_clock script hands over to the clock face by testing for
      # it by name, so picking Twinkle by hand means the next reconnect or SNTP
      # sync will quietly replace it with Time.
      #
      # The ambient-dim block itself is copied into four of the five lambdas
      # rather than shared - Alarm is the exception, deliberately, for the
      # reason given on it. addressable_lambda has no way to call across
      # effects: sharing would mean esphome: includes: and a second file, and
      # keeping this device in one file is worth more than saving three copies
      # of six lines.
      #
      - addressable_rainbow:
          name: Rainbow
          speed: 10
          width: 50

      - addressable_color_wipe:
          name: Color Wipe
          add_led_interval: 100ms
          reverse: false

      - addressable_fireworks:
          name: Fireworks
          update_interval: 32ms
          spark_probability: 10%
          use_random_color: false
          fade_out_rate: 120

      - addressable_twinkle:
          name: Twinkle
          twinkle_probability: 5%
          progress_interval: 4ms

      - addressable_random_twinkle:
          name: Random Twinkle
          twinkle_probability: 5%
          progress_interval: 32ms

    # Switching the light on always lands on the clock face at a known
    # brightness, whatever effect or colour was last set from Home Assistant.
    on_turn_on:
      # Only normalises a switch-on that did not ask for anything specific.
      #
      # Without the guard this fires for EVERY turn_on and overrides the effect
      # that was just requested - the alarm would set Alarm, this trigger would
      # immediately put it back to Time, and the ring would never pulse. By the
      # time the trigger runs the call has already applied its effect, so
      # "None" here means "switched on without one".
      - if:
          condition:
            lambda: return id(led_ring_id).get_effect_name().str() == "None";
          then:
            - light.turn_on:
                id: led_ring_id
                brightness: ${DEFAULT_BRIGHTNESS}
                red: ${IDLE_RED}
                green: ${IDLE_GREEN}
                blue: ${IDLE_BLUE}
                effect: Time
